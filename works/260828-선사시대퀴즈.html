<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>선사시대 모험 퀴즈</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:"Malgun Gothic","맑은 고딕",-apple-system,"Apple SD Gothic Neo",sans-serif;
    background:linear-gradient(160deg,#f7ecd4 0%,#eeddb8 60%,#e5d0a5 100%);
    color:#3d2c17;
    touch-action:manipulation;
    overflow-x:hidden;
  }
  .screen { display:none; min-height:100vh; min-height:100dvh; width:100%; max-width:920px; margin:0 auto;
    padding:16px; flex-direction:column; align-items:center; justify-content:center; }
  .screen.on { display:flex; }
  .btn {
    display:inline-block; border:none; cursor:pointer; user-select:none;
    min-height:56px; padding:14px 28px; border-radius:16px;
    font-family:inherit; font-size:1.3rem; font-weight:700; color:#fff;
    background:#8a5a25; box-shadow:0 4px 0 #6b4318;
    transition:transform .08s;
  }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #6b4318; }
  .btn.big { font-size:1.6rem; padding:18px 44px; border-radius:22px; }
  .btn.green { background:#4e7c31; box-shadow:0 4px 0 #3a5e23; }
  .btn.green:active { box-shadow:0 1px 0 #3a5e23; }

  /* ---------- start ---------- */
  #startScr .hero { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .gameTitle { font-size:clamp(1.9rem,6vw,3rem); font-weight:900; color:#5c3a12;
    text-shadow:0 2px 0 #fff6; letter-spacing:-1px; text-align:center; }
  .gameSub { font-size:1.05rem; color:#7a5c33; text-align:center; }
  .bubble {
    position:relative; background:#fff; border:3px solid #8a5a25; border-radius:20px;
    padding:14px 22px; font-size:1.25rem; font-weight:700; color:#4a3010;
    max-width:340px; text-align:center; margin-bottom:6px;
  }
  .bubble::after {
    content:""; position:absolute; left:50%; bottom:-14px; transform:translateX(-50%);
    border:8px solid transparent; border-top:10px solid #8a5a25;
  }
  .charBox { width:170px; }
  .charBox svg { width:100%; height:auto; display:block; }
  .rules { margin-top:14px; background:#fff8e8; border:2px dashed #c9a25e; border-radius:14px;
    padding:12px 18px; font-size:1rem; color:#6a4c22; line-height:1.7; text-align:center; }

  /* ---------- map ---------- */
  #mapScr { justify-content:center; }
  .mapTitle { font-size:1.35rem; font-weight:800; color:#5c3a12; margin-bottom:8px; text-align:center; }
  .mapWrap { position:relative; width:100%; }
  .mapWrap svg.mapbg { width:100%; height:auto; display:block; border-radius:18px;
    box-shadow:0 6px 18px #0002; }
  #mapChar { position:absolute; width:9%; transform:translate(-50%,-92%); pointer-events:none;
    transition:left 1.15s ease-in-out, top 1.15s ease-in-out; }
  #mapChar svg { width:100%; height:auto; display:block; }
  #mapChar.hop .body { animation:hop .38s ease-in-out infinite; }
  #mapChar.stumble .body { animation:stumble .8s ease-in-out 1; }
  #mapChar.cheer .body { animation:cheer .5s ease-in-out infinite; }
  @keyframes hop { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-16%) rotate(-4deg)} }
  @keyframes stumble { 0%{transform:rotate(0)} 30%{transform:rotate(70deg) translateY(12%)}
    60%{transform:rotate(70deg) translateY(12%)} 100%{transform:rotate(0)} }
  @keyframes cheer { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-12%) scale(1.06)} }
  #zoneBanner {
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(0);
    background:#5c3a12ee; color:#ffe9b8; font-size:clamp(1.1rem,3.4vw,1.7rem); font-weight:800;
    padding:12px 26px; border-radius:999px; white-space:nowrap; opacity:0;
    transition:transform .35s cubic-bezier(.2,1.6,.4,1), opacity .3s;
  }
  #zoneBanner.show { transform:translate(-50%,-50%) scale(1); opacity:1; }
  #skipBtn { margin-top:14px; }
  .mapMsg { margin-top:10px; font-size:1.05rem; color:#6a4c22; min-height:1.6em; text-align:center; }

  /* ---------- quiz ---------- */
  #quizScr { justify-content:flex-start; padding-top:12px; }
  .topBar { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin-bottom:8px; }
  .qNum { font-size:1.1rem; font-weight:800; color:#5c3a12; background:#fff8e8;
    border-radius:999px; padding:7px 16px; border:2px solid #d9bd85; }
  .zoneTag { font-size:1rem; font-weight:800; padding:7px 16px; border-radius:999px; color:#fff; }
  .zoneTag.z0 { background:#7a6a55; } .zoneTag.z1 { background:#5e8b3c; } .zoneTag.z2 { background:#2e7d74; }
  .scoreTag { font-size:1.1rem; font-weight:800; color:#8a5a25; background:#fff8e8;
    border-radius:999px; padding:7px 16px; border:2px solid #d9bd85; }
  .timerWrap { width:100%; background:#d9c9a4; height:18px; border-radius:9px; overflow:hidden;
    margin-bottom:4px; }
  #timerBar { height:100%; width:100%; background:linear-gradient(90deg,#69a83e,#8cc152); border-radius:9px; }
  #timerBar.low { background:linear-gradient(90deg,#d8452e,#ef7b40); }
  .timerSec { align-self:flex-end; font-size:.95rem; font-weight:700; color:#8a6a3a; margin-bottom:6px; }
  .qCard { width:100%; background:#fffdf6; border-radius:20px; padding:18px;
    box-shadow:0 6px 16px #0002; display:flex; flex-direction:column; gap:14px; }
  .qText { font-size:clamp(1.2rem,3.6vw,1.55rem); font-weight:800; line-height:1.5; color:#33230e; }
  .qText u { text-decoration:underline; text-underline-offset:3px; color:#c0392b; }
  .qImg { align-self:center; max-width:min(100%,420px); max-height:30dvh; border-radius:14px;
    border:3px solid #e2d3ac; background:#fff; object-fit:contain; }
  .choices { display:flex; flex-direction:column; gap:10px; }
  .choiceBtn {
    width:100%; text-align:left; min-height:58px; padding:13px 16px; border-radius:14px;
    border:3px solid #d9bd85; background:#fff; font-family:inherit;
    font-size:clamp(1.05rem,3.2vw,1.3rem); font-weight:700; color:#4a3413; cursor:pointer;
    display:flex; align-items:center; gap:10px; line-height:1.4;
  }
  .choiceBtn .cnum { flex:0 0 auto; width:34px; height:34px; border-radius:50%; background:#efe2c0;
    color:#8a5a25; font-weight:900; display:flex; align-items:center; justify-content:center; }
  .choiceBtn:active { background:#f7edd6; }
  .oxRow { display:flex; gap:16px; justify-content:center; }
  .oxBtn { flex:1; max-width:190px; aspect-ratio:1/.82; border-radius:20px; border:none; cursor:pointer;
    font-size:clamp(2.6rem,10vw,4rem); font-weight:900; color:#fff; font-family:inherit; }
  .oxBtn.o { background:#3d84c6; box-shadow:0 5px 0 #2b619a; }
  .oxBtn.x { background:#d8452e; box-shadow:0 5px 0 #a53321; }
  .oxBtn:active { transform:translateY(4px); box-shadow:none; }
  .saRow { display:flex; gap:10px; }
  #saInput { flex:1; min-width:0; min-height:60px; font-size:1.5rem; font-family:inherit; font-weight:700;
    padding:8px 16px; border-radius:14px; border:3px solid #d9bd85; color:#33230e; background:#fff; }
  #saInput:focus { outline:none; border-color:#8a5a25; }

  /* ---------- feedback ---------- */
  #fbOverlay { position:fixed; inset:0; background:#3a2a10aa; display:none;
    align-items:center; justify-content:center; padding:16px; z-index:30; }
  #fbOverlay.on { display:flex; }
  .fbCard { width:100%; max-width:560px; max-height:92dvh; overflow-y:auto; background:#fffdf6; border-radius:22px;
    padding:20px; display:flex; flex-direction:column; align-items:center; gap:12px;
    animation:pop .3s cubic-bezier(.2,1.5,.4,1); }
  @keyframes pop { from{transform:scale(.7); opacity:0} to{transform:scale(1); opacity:1} }
  .fbHead { font-size:2rem; font-weight:900; }
  .fbHead.good { color:#3f7d22; } .fbHead.bad { color:#d8452e; }
  .fbPoints { font-size:1.4rem; font-weight:800; color:#8a5a25; }
  .fbAnswer { font-size:1.25rem; font-weight:800; color:#33230e; background:#f3e7c8;
    border-radius:12px; padding:10px 18px; text-align:center; }
  .fbExp { font-size:1.15rem; line-height:1.65; color:#4a3413; background:#fbf5e4;
    border-left:6px solid #d9bd85; border-radius:0 12px 12px 0; padding:12px 16px; width:100%; }
  .fbImg { max-width:min(100%,360px); max-height:26dvh; border-radius:12px; border:3px solid #e2d3ac;
    object-fit:contain; }
  .fbChar { width:110px; }
  .fbChar svg { width:100%; height:auto; }
  .fbChar.good .body { animation:cheer .5s ease-in-out infinite; }
  .fbChar.bad .body { animation:sadwob 1.4s ease-in-out infinite; }
  @keyframes sadwob { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }

  /* ---------- end ---------- */
  #endScr .endCard { width:100%; max-width:560px; background:#fffdf6; border-radius:24px;
    padding:26px 20px; display:flex; flex-direction:column; align-items:center; gap:14px;
    box-shadow:0 8px 24px #0003; }
  .endTitle { font-size:1.7rem; font-weight:900; color:#5c3a12; }
  .medal { font-size:clamp(1.6rem,6vw,2.2rem); font-weight:900; color:#fff; background:linear-gradient(135deg,#c9962c,#a06b18);
    padding:12px 34px; border-radius:999px; box-shadow:0 4px 12px #0003; text-align:center; }
  .endScore { font-size:2.6rem; font-weight:900; color:#33230e; }
  .endCount { font-size:1.2rem; font-weight:700; color:#7a5c33; }
  .endLine { font-size:1.15rem; color:#4a3413; text-align:center; line-height:1.6; }
  .confetti { position:fixed; top:-20px; font-size:1.3rem; z-index:5; pointer-events:none;
    animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110dvh) rotate(720deg); opacity:.6; } }

  @media (orientation:landscape) and (max-height:560px) {
    .qCard { padding:12px; gap:9px; }
    .qImg { max-height:36dvh; }
    .charBox { width:120px; }
    .rules { margin-top:8px; padding:8px 14px; }
  }
</style>
</head>
<body>

<!-- ========== 시작 화면 ========== -->
<div id="startScr" class="screen on">
  <div class="hero">
    <div class="gameTitle">선사시대 모험 퀴즈</div>
    <div class="gameSub">구석기 &middot; 신석기 &middot; 청동기를 건너는 열다섯 개의 징검다리</div>
    <div style="height:10px"></div>
    <div class="bubble">안녕! 나는 돌이야.<br>나와 함께 선사시대 문제를 풀어보자!</div>
    <div class="charBox" id="startChar"></div>
    <button class="btn big green" id="startBtn">모험 시작!</button>
    <div class="rules">
      문제는 모두 15개, 한 문제에 <b>20초</b>!<br>
      맞히면 100점 + 남은 시간만큼 보너스 점수를 받아요.<br>
      틀려도 괜찮아요. 넘어져도 다시 일어나면 되니까요.
    </div>
  </div>
</div>

<!-- ========== 지도 화면 ========== -->
<div id="mapScr" class="screen">
  <div class="mapTitle" id="mapTitle">모험 지도</div>
  <div class="mapWrap">
    <svg class="mapbg" id="mapSvg" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="mapChar"></div>
    <div id="zoneBanner"></div>
  </div>
  <div class="mapMsg" id="mapMsg"></div>
  <button class="btn" id="skipBtn" style="background:#9a8a6a; box-shadow:0 4px 0 #7a6c50;">건너뛰기</button>
</div>

<!-- ========== 문제 화면 ========== -->
<div id="quizScr" class="screen">
  <div class="topBar">
    <span class="qNum" id="qNum">문제 1 / 15</span>
    <span class="zoneTag z0" id="zoneTag">구석기</span>
    <span class="scoreTag" id="scoreTag">0점</span>
  </div>
  <div class="timerWrap"><div id="timerBar"></div></div>
  <div class="timerSec" id="timerSec">20초</div>
  <div class="qCard">
    <div class="qText" id="qText"></div>
    <img class="qImg" id="qImg" alt="유물 사진" style="display:none">
    <div class="choices" id="choiceBox"></div>
  </div>
</div>

<!-- ========== 정답/해설 오버레이 ========== -->
<div id="fbOverlay">
  <div class="fbCard">
    <div class="fbHead" id="fbHead"></div>
    <div class="fbChar" id="fbChar"></div>
    <div class="fbPoints" id="fbPoints"></div>
    <div class="fbAnswer" id="fbAnswer"></div>
    <img class="fbImg" id="fbImg" alt="해설 그림" style="display:none">
    <div class="fbExp" id="fbExp"></div>
    <button class="btn green" id="nextBtn">다음 문제</button>
  </div>
</div>

<!-- ========== 마지막 화면 ========== -->
<div id="endScr" class="screen">
  <div class="endCard">
    <div class="endTitle">모험 끝!</div>
    <div class="medal" id="medalTxt"></div>
    <div class="endScore" id="endScore"></div>
    <div class="endCount" id="endCount"></div>
    <div class="fbChar good" id="endChar" style="width:130px"></div>
    <div class="endLine" id="endLine"></div>
    <button class="btn big green" id="retryBtn">다시 하기</button>
  </div>
</div>

    '<circle cx="60" cy="44" r="25" fill="#f8d3a5"/>' +
    '<path d="M37 36 Q42 20 60 19 Q78 20 83 36 Q74 28 60 28 Q46 28 37 36 Z" fill="#6b4423"/>' +
    // 뼈다귀 머리핀
    '<g transform="rotate(-24 82 22)">' +
      '<rect x="74" y="19" width="17" height="4.5" rx="2.2" fill="#fdf6e3" stroke="#d9c9a4" stroke-width="1"/>' +
      '<circle cx="74" cy="19.5" r="3" fill="#fdf6e3" stroke="#d9c9a4" stroke-width="1"/>' +
      '<circle cx="74" cy="24" r="3" fill="#fdf6e3" stroke="#d9c9a4" stroke-width="1"/>' +
      '<circle cx="91" cy="19.5" r="3" fill="#fdf6e3" stroke="#d9c9a4" stroke-width="1"/>' +
      '<circle cx="91" cy="24" r="3" fill="#fdf6e3" stroke="#d9c9a4" stroke-width="1"/>' +
    '</g>' +
    // 눈, 볼, 입
    '<circle cx="51" cy="44" r="4" fill="#33230e"/><circle cx="69" cy="44" r="4" fill="#33230e"/>' +
    '<circle cx="52.4" cy="42.6" r="1.4" fill="#fff"/><circle cx="70.4" cy="42.6" r="1.4" fill="#fff"/>' +
    '<ellipse cx="45" cy="53" rx="4.6" ry="3" fill="#f7a8a0" opacity=".75"/>' +
    '<ellipse cx="75" cy="53" rx="4.6" ry="3" fill="#f7a8a0" opacity=".75"/>' +
    '<path d="M54 56 Q60 62 66 56" fill="none" stroke="#a0522d" stroke-width="2.6" stroke-linecap="round"/>' +
  '</g></svg>';
}

/* ---------------- 지도 SVG ---------------- */
var STONES = [];
(function () {
  for (var i = 0; i < 15; i++) {
    STONES.push({ x: 64 + i * 62, y: (i % 2 === 0) ? 232 : 252 });
  }
})();
var START_PT = { x: 22, y: 244 };
var GOAL_PT = { x: 968, y: 236 };

function buildMap() {
  var s = "";
  // 하늘, 땅
  s += '<rect x="0" y="0" width="1000" height="300" fill="#dff0f7"/>';
  s += '<rect x="0" y="205" width="340" height="95" fill="#cfc2a2"/>';
  s += '<rect x="340" y="205" width="320" height="95" fill="#cfe0a8"/>';
  s += '<rect x="660" y="205" width="340" height="95" fill="#e0d3a0"/>';
  s += '<circle cx="905" cy="52" r="26" fill="#ffd66b" stroke="#f2b53c" stroke-width="4"/>';
  // 구석기: 바위산 + 동굴
  s += '<path d="M-10 205 L60 96 L130 205 Z" fill="#8d8577"/>';
  s += '<path d="M70 205 L150 120 L235 205 Z" fill="#a29a89"/>';
  s += '<path d="M110 205 Q150 148 190 205 Z" fill="#4a4038"/>';
  s += '<path d="M124 205 Q150 166 176 205 Z" fill="#2c241e"/>';
  s += '<circle cx="253" cy="182" r="10" fill="#7d7566"/><circle cx="270" cy="190" r="7" fill="#8d8577"/>';
  // 모닥불
  s += '<g transform="translate(215 192)"><path d="M-10 8 L10 8 M-8 10 L8 4 M-8 4 L8 10" stroke="#7a5230" stroke-width="3" stroke-linecap="round"/>' +
       '<path d="M0 -12 Q6 -4 2 2 Q8 0 6 6 Q0 12 -6 6 Q-8 0 -2 2 Q-6 -4 0 -12 Z" fill="#f2903c"/><path d="M0 -5 Q3 -1 1 3 Q-3 5 -4 1 Q-3 -2 0 -5 Z" fill="#ffd66b"/></g>';
  // 신석기: 움집 2채 + 나무
  function hut(x, y, w, h) {
    return '<path d="M' + x + ' ' + y + ' L' + (x + w / 2) + ' ' + (y - h) + ' L' + (x + w) + ' ' + y + ' Z" fill="#d9b45f" stroke="#a8842f" stroke-width="3"/>' +
      '<path d="M' + (x + w * 0.38) + ' ' + y + ' L' + (x + w / 2) + ' ' + (y - h * 0.42) + ' L' + (x + w * 0.62) + ' ' + y + ' Z" fill="#6b4a1e"/>';
  }
  s += hut(370, 200, 105, 84);
  s += hut(500, 202, 88, 70);
  s += '<rect x="617" y="168" width="9" height="36" rx="4" fill="#8f6b3a"/><circle cx="621" cy="156" r="22" fill="#79a844"/>';
  // 청동기: 고인돌 + 울타리
  s += '<rect x="742" y="148" width="22" height="56" rx="4" fill="#8d8577" stroke="#6e675b" stroke-width="3"/>';
  s += '<rect x="806" y="148" width="22" height="56" rx="4" fill="#8d8577" stroke="#6e675b" stroke-width="3"/>';
  s += '<rect x="722" y="120" width="126" height="32" rx="14" fill="#a29a89" stroke="#6e675b" stroke-width="3"/>';
  var fx;
  for (fx = 866; fx <= 946; fx += 16) {
    s += '<path d="M' + fx + ' 204 L' + fx + ' 168 L' + (fx + 6) + ' 160 L' + (fx + 12) + ' 168 L' + (fx + 12) + ' 204 Z" fill="#b98a4e" stroke="#906634" stroke-width="2"/>';
  }
  // 구역 팻말
  function sign(x, label, col) {
    return '<g><rect x="' + (x - 46) + '" y="14" width="92" height="30" rx="8" fill="' + col + '"/>' +
      '<text x="' + x + '" y="35" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff" font-family="Malgun Gothic,sans-serif">' + label + '</text></g>';
  }
  s += sign(170, "구석기", "#7a6a55");
  s += sign(500, "신석기", "#5e8b3c");
  s += sign(830, "청동기", "#2e7d74");
  // 길 리본
  var path = "M " + START_PT.x + " " + (START_PT.y + 8);
  for (var i = 0; i < 15; i++) { path += " L " + STONES[i].x + " " + (STONES[i].y + 6); }
  path += " L " + GOAL_PT.x + " " + (GOAL_PT.y + 12);
  s += '<path d="' + path + '" fill="none" stroke="#bfae87" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>';
  // 징검다리 15개
  for (var j = 0; j < 15; j++) {
    var st = STONES[j];
    s += '<g id="stone' + j + '"><ellipse cx="' + st.x + '" cy="' + (st.y + 6) + '" rx="24" ry="12" fill="#b7a98c" stroke="#8d7f63" stroke-width="3"/>' +
      '<text x="' + st.x + '" y="' + (st.y + 12) + '" text-anchor="middle" font-size="15" font-weight="bold" fill="#6e5f43" font-family="Malgun Gothic,sans-serif">' + (j + 1) + '</text></g>';
  }
  // 도착 깃발
  s += '<g><rect x="' + GOAL_PT.x + '" y="' + (GOAL_PT.y - 58) + '" width="6" height="70" rx="3" fill="#8f6b3a"/>' +
    '<path d="M' + (GOAL_PT.x + 6) + ' ' + (GOAL_PT.y - 56) + ' L' + (GOAL_PT.x - 40) + ' ' + (GOAL_PT.y - 44) + ' L' + (GOAL_PT.x + 6) + ' ' + (GOAL_PT.y - 32) + ' Z" fill="#d8452e"/></g>';
  return s;
}

/* ---------------- 상태 ---------------- */
var idx = 0;             // 현재 문제 번호 (0~14)
var score = 0;
var correctCnt = 0;
var timerId = null;
var remain = 20;
var answered = false;
var mapToken = 0;        // 지도 연출 취소용
var pendingAfterMap = null;

var $ = function (id) { return document.getElementById(id); };

function show(id) {
  ["startScr", "mapScr", "quizScr", "endScr"].forEach(function (s) {
    $(s).classList.toggle("on", s === id);
  });
}

/* ---------------- 지도 연출 ---------------- */
function charPos(pt) {
  $("mapChar").style.left = (pt.x / 10) + "%";
  $("mapChar").style.top = (pt.y / 3) + "%";
}
function ptOf(i) {
  if (i < 0) return START_PT;
  if (i >= 15) return GOAL_PT;
  return STONES[i];
}
// from,to: -1=출발점, 0~14=징검다리, 15=도착 깃발
function playMap(from, to, wasWrong, after) {
  var token = ++mapToken;
  pendingAfterMap = after;
  show("mapScr");
  var mc = $("mapChar");
  mc.className = "";
  $("mapTitle").textContent = (to >= 15) ? "도착!" : "모험 지도";
  $("mapMsg").textContent = wasWrong ? "괜찮아, 툭툭 털고 다음 돌다리로!" : "";
  // 즉시 배치 (transition 없이)
  mc.style.transition = "none";
  charPos(ptOf(from));
  void mc.offsetWidth;
  mc.style.transition = "";

  var crossed = (to <= 14 && (from < 0 || QUESTIONS[from].zone !== QUESTIONS[to].zone)) ? QUESTIONS[to].zone : -1;
  var t = 0;
  function step(fn, ms) { t += ms; setTimeout(function () { if (token === mapToken) fn(); }, t); }

  if (wasWrong) {
    mc.classList.add("stumble");
    step(function () { mc.classList.remove("stumble"); }, 850);
  }
  step(function () {
    mc.classList.add("hop");
    charPos(ptOf(to));
  }, wasWrong ? 100 : 350);
  step(function () {
    mc.classList.remove("hop");
    if (crossed >= 0) {
      $("zoneBanner").textContent = ZONE_BANNERS[crossed];
      $("zoneBanner").classList.add("show");
      mc.classList.add("cheer");
    }
  }, 1250);
  step(function () { finishMap(); }, crossed >= 0 ? 1500 : 500);
}
function finishMap() {
  mapToken++;
  $("zoneBanner").classList.remove("show");
  $("mapChar").className = "";
  var fn = pendingAfterMap;
  pendingAfterMap = null;
  if (fn) fn();
}
/* ---------------- 문제 표시 ---------------- */
function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

/* 선택형 보기 섞기 — 문제를 보여줄 때마다 순서를 무작위로.
   정답은 '보기 내용'으로 붙잡아 두었다가 섞인 뒤 위치를 다시 찾는다(번호도 새 순서대로 다시 매겨짐). */
function shuffleMC(q) {
  var correct = q.choices[q.answer];
  for (var i = q.choices.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = q.choices[i]; q.choices[i] = q.choices[j]; q.choices[j] = t;
  }
  q.answer = q.choices.indexOf(correct);
}

function showQuestion() {
  var q = QUESTIONS[idx];
  answered = false;
  show("quizScr");
  $("qNum").textContent = "문제 " + (idx + 1) + " / 15";
  $("zoneTag").textContent = ZONES[q.zone];
  $("zoneTag").className = "zoneTag z" + q.zone;
  $("scoreTag").textContent = score + "점";
  $("qText").innerHTML = q.q;   // 문제 문장(신뢰된 내부 데이터, u 태그 포함 가능)
  if (q.img) { $("qImg").src = IMG[q.img]; $("qImg").style.display = ""; }
  else { $("qImg").style.display = "none"; $("qImg").removeAttribute("src"); }

  var box = $("choiceBox");
  box.innerHTML = "";
  if (q.type === "ox") {
    var row = document.createElement("div");
    row.className = "oxRow";
    ["O", "X"].forEach(function (v) {
      var b = document.createElement("button");
      b.className = "oxBtn " + v.toLowerCase();
      b.textContent = v;
      b.addEventListener("click", function () { submit(v); });
      row.appendChild(b);
    });
    box.appendChild(row);
  } else if (q.type === "mc") {
    shuffleMC(q);
    var nums = ["①", "②", "③", "④"];
    q.choices.forEach(function (c, i) {
      var b = document.createElement("button");
      b.className = "choiceBtn";
      b.innerHTML = '<span class="cnum">' + nums[i] + '</span><span>' + esc(c) + '</span>';
      b.addEventListener("click", function () { submit(i); });
      box.appendChild(b);
    });
  } else { // 단답형
    var row2 = document.createElement("div");
    row2.className = "saRow";
    var inp = document.createElement("input");
    inp.id = "saInput";
    inp.type = "text";
    inp.autocomplete = "off";
    inp.placeholder = "답을 써 보자";
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.isComposing) submit(inp.value);
    });
    var ok = document.createElement("button");
    ok.className = "btn green";
    ok.textContent = "확인";
    ok.addEventListener("click", function () { submit(inp.value); });
    row2.appendChild(inp);
    row2.appendChild(ok);
    box.appendChild(row2);
  }
  startTimer();
}

/* ---------------- 타이머 ---------------- */
function startTimer() {
  stopTimer();
  remain = 20.0;
  renderTimer();
  timerId = setInterval(function () {
    remain -= 0.1;
    if (remain <= 0) { remain = 0; renderTimer(); stopTimer(); onTimeout(); return; }
    renderTimer();
  }, 100);
}
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function renderTimer() {
  var pct = (remain / 20) * 100;
  $("timerBar").style.width = pct + "%";
  $("timerBar").classList.toggle("low", remain <= 5);
  $("timerSec").textContent = Math.ceil(remain) + "초";
}

/* ---------------- 채점 ---------------- */
function norm(s) { return String(s).replace(/\s+/g, ""); }
function isCorrect(q, val) {
  if (q.type === "ox") return val === q.answer;
  if (q.type === "mc") return val === q.answer;
  var v = norm(val);
  if (!v) return false;
  return q.answers.some(function (a) { return norm(a) === v; });
}
function answerText(q) {
  if (q.type === "ox") return q.answer;
  if (q.type === "mc") return ["①", "②", "③", "④"][q.answer] + " " + q.choices[q.answer];
  return q.display;
}

function submit(val) {
  if (answered) return;
  answered = true;
  stopTimer();
  var q = QUESTIONS[idx];
  var good = isCorrect(q, val);
  var pts = 0;
  if (good) {
    pts = 100 + Math.floor(remain) * 5;
    score += pts;
    correctCnt++;
  }
  showFeedback(good, pts, false);
}
function onTimeout() {
  if (answered) return;
  answered = true;
  showFeedback(false, 0, true);
}

/* ---------------- 정답/해설 ---------------- */
function showFeedback(good, pts, timeout) {
  var q = QUESTIONS[idx];
  $("fbHead").textContent = good ? "정답!" : (timeout ? "시간이 다 됐어!" : "아쉬워!");
  $("fbHead").className = "fbHead " + (good ? "good" : "bad");
  $("fbChar").innerHTML = charSVG();
  $("fbChar").className = "fbChar " + (good ? "good" : "bad");
  $("fbPoints").textContent = good ? ("+" + pts + "점  (" + PRAISE[Math.floor(Math.random() * PRAISE.length)] + ")") : "+0점";
  $("fbAnswer").textContent = "정답: " + answerText(q);
  $("fbExp").textContent = q.exp;
  var ei = q.expImg || ((!good && q.img) ? q.img : null);
  if (ei) { $("fbImg").src = IMG[ei]; $("fbImg").style.display = ""; }
  else { $("fbImg").style.display = "none"; $("fbImg").removeAttribute("src"); }
  $("scoreTag").textContent = score + "점";
  $("nextBtn").textContent = (idx >= 14) ? "결과 보기" : "다음 문제";
  $("nextBtn").dataset.wrong = good ? "0" : "1";
  $("fbOverlay").classList.add("on");
}

$("nextBtn").addEventListener("click", function () {
  $("fbOverlay").classList.remove("on");
  var wasWrong = $("nextBtn").dataset.wrong === "1";
  var from = idx;
  idx++;
  if (idx >= 15) {
    playMap(from, 15, wasWrong, showEnd);
  } else {
    playMap(from, idx, wasWrong, showQuestion);
  }
});

$("skipBtn").addEventListener("click", function () { finishMap(); });
$("mapSvg").addEventListener("click", function () { if (pendingAfterMap) finishMap(); });

/* ---------------- 끝 화면 ---------------- */
function medalFor(sc) {
  if (sc >= 1500) return "선사시대 박사";
  if (sc >= 1000) return "유물 지킴이";
  if (sc >= 500) return "시대 탐험가";
  return "다시 도전!";
}
function showEnd() {
  show("endScr");
  $("medalTxt").textContent = medalFor(score);
  $("endScore").textContent = score + "점";
  $("endCount").textContent = "15문제 중 " + correctCnt + "문제를 맞혔어요";
  $("endChar").innerHTML = charSVG();
  var line;
  if (score >= 1500) line = "구석기부터 청동기까지, 유물 박사가 다 됐는걸! 여기까지 함께 와 줘서 고마워.";
  else if (score >= 1000) line = "유물을 지킬 만큼 잘 알게 됐어! 여기까지 함께 와 줘서 고마워.";
  else if (score >= 500) line = "세 시대를 끝까지 건넜네! 한 번 더 하면 점수가 쑥 오를 거야.";
  else line = "끝까지 건넌 것만으로도 대단해. 한 번 더 도전해 보자!";
  $("endLine").textContent = line;
  confetti();
}
function confetti() {
  var marks = ["＊", "●", "▲", "■", "★"];
  var cols = ["#d8452e", "#f2b53c", "#5e8b3c", "#3d84c6", "#8a5a25"];
  for (var i = 0; i < 26; i++) {
    var d = document.createElement("div");
    d.className = "confetti";
    d.textContent = marks[i % marks.length];
    d.style.color = cols[i % cols.length];
    d.style.left = (Math.random() * 96) + "%";
    d.style.animationDuration = (2.2 + Math.random() * 2.2) + "s";
    d.style.animationDelay = (Math.random() * 0.9) + "s";
    document.body.appendChild(d);
    setTimeout(function (el) { return function () { el.remove(); }; }(d), 6000);
  }
}

/* ---------------- 시작, 다시하기 ---------------- */
function resetGame() {
  idx = 0; score = 0; correctCnt = 0;
  playMap(-1, 0, false, showQuestion);
}
$("startBtn").addEventListener("click", resetGame);
$("retryBtn").addEventListener("click", resetGame);

/* ---------------- 초기화 ---------------- */
$("mapSvg").innerHTML = buildMap();
$("startChar").innerHTML = charSVG();
$("mapChar").innerHTML = charSVG();
</script>
