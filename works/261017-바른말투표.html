<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바른말 투표 미리보기</title>
<style>
:root{--bg:#E9EDF2;--paper:#fff;--ink:#1B2430;--muted:#5F6B7A;--line:#D7DDE5;--accent:#2F55A4;--soft:#E4EBF8;--warn:#B4401A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;font-size:16px}
header{background:var(--ink);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:18px}
header .note{opacity:.75;font-size:14px}
nav{display:flex;gap:6px;padding:10px 16px 0;flex-wrap:wrap}
nav button{font:inherit;padding:10px 18px;border:0;border-radius:12px 12px 0 0;background:#D3DAE4;cursor:pointer;font-weight:700}
nav button.on{background:var(--paper);color:var(--accent)}
.pane{display:none;background:var(--paper);margin:0 16px 16px;padding:14px;border-radius:0 12px 12px 12px}
.pane.on{display:block}
.frame-wrap{margin:0 auto;border:8px solid #2B3340;border-radius:22px;overflow:hidden;background:#fff;transition:width .2s}
iframe{display:block;width:100%;height:78vh;border:0;background:#F3F5F7}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools button{font:inherit;padding:8px 14px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-weight:700}
.tools button.main{background:var(--accent);color:#fff;border-color:var(--accent)}
.tools .sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.log{font-size:14px;color:var(--muted);min-height:1.4em;margin:6px 0 10px}
.sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.sheets h3{margin:0 0 6px;font-size:15px}
table{border-collapse:collapse;font-size:13px;width:100%}
td,th{border:1px solid var(--line);padding:3px 6px;text-align:left;white-space:nowrap}
th{background:var(--soft)}
.scroll{max-height:46vh;overflow:auto}
.hint{font-size:14px;color:var(--muted);margin:0 0 10px;line-height:1.6}
</style>
</head>
<body>
<header><b>바른말 투표 — 미리보기(시험판)</b>
<span class="note">구글 없이 이 컴퓨터 안에서만 돌아가요. 진짜 투표는 구글에 올린 주소로 합니다. 결과 비밀번호: 1234</span></header>
<nav>
<button class="on" data-p="s">학생 화면</button>
<button data-p="r">결과 화면 (선생님)</button>
<button data-p="t">시험 도우미 · 시트 보기</button>
</nav>

<section class="pane on" id="p-s">
<div class="tools">
<button onclick="폭(375)">휴대폰 폭</button><button onclick="폭(800)">태블릿 폭</button><button onclick="폭(0)">넓게</button>
<span class="sep"></span>
<button onclick="학생다시()">다른 아이 기기처럼 새로 열기</button>
</div>
<div class="frame-wrap" id="fw" style="width:800px;max-width:100%"><iframe id="fs" title="학생 화면"></iframe></div>
</section>

<section class="pane" id="p-r">
<div class="tools"><button onclick="결과다시()">결과 화면 새로 열기</button></div>
<div class="frame-wrap" style="width:100%"><iframe id="fr" title="결과 화면"></iframe></div>
</section>

<section class="pane" id="p-t">
<p class="hint">순서대로 눌러 보면 1차 → 동점 → 결선 → 추첨까지 볼 수 있어요. 마감·결선 열기·추첨은 「결과 화면」 탭의 버튼으로 하세요.<br>
아래 표는 진짜 구글 시트에 쌓일 모양 그대로예요(시간 칸만 짧게).</p>
<div class="tools">
<button class="main" onclick="처음상태()">처음 상태로</button>
<span class="sep"></span>
<button onclick="동점만들기()">1차: 3번·7번 동점 되게 모두 내기</button>
<button onclick="무작위()">남은 사람 무작위로 내기</button>
<span class="sep"></span>
<button onclick="결선반반()">결선: 8 대 8 (17번은 안 냄)</button>
<button onclick="결선당선()">결선: 7번이 이기게</button>
</div>
<p class="log" id="log"></p>
<div class="sheets" id="sheets"></div>
</section>

<script>
/*
 * 가짜시트.js — 구글 시트·잠금(LockService)을 흉내 내는 시험용 부품.
 * node 시험(도구/시험.js)과 미리보기_테스트.html이 함께 씁니다.
 * 진짜 구글에는 올리지 않습니다.
 */
function 가짜구글_만들기() {
  var 탭들 = [];

  function 숫자처럼(v) {
    return typeof v === 'string' && /^-?\d+(\.\d+)?$/.test(v.trim());
  }

  function 가짜탭(이름) {
    var t = { 이름: 이름, 줄: [], 글자칸: {} };

    function 칸쓰기(r, c, v) {
      while (t.줄.length < r) t.줄.push([]);
      var row = t.줄[r - 1];
      while (row.length < c) row.push('');
      if (v === null || v === undefined) v = '';
      if (t.글자칸[c]) v = (v instanceof Date) ? v : String(v);
      else if (숫자처럼(v)) v = Number(v);   // 시트는 숫자처럼 생긴 글자를 숫자로 바꿔 둔다
      row[c - 1] = v;
    }
    function 칸읽기(r, c) {
      var row = t.줄[r - 1];
      if (!row || row[c - 1] === undefined) return '';
      return row[c - 1];
    }
    function 끝줄() {
      for (var i = t.줄.length; i > 0; i--) {
        if (t.줄[i - 1].some(function (v) { return v !== ''; })) return i;
      }
      return 0;
    }
    function 끝칸() {
      var m = 0;
      t.줄.forEach(function (row) {
        for (var j = row.length; j > 0; j--) { if (row[j - 1] !== '') { m = Math.max(m, j); break; } }
      });
      return m;
    }

    function 범위(r, c, nr, nc) {
      nr = nr || 1; nc = nc || 1;
      var g = {
        getValues: function () {
          var out = [];
          for (var i = 0; i < nr; i++) {
            var row = [];
            for (var j = 0; j < nc; j++) row.push(칸읽기(r + i, c + j));
            out.push(row);
          }
          return out;
        },
        getValue: function () { return 칸읽기(r, c); },
        setValues: function (vals) {
          if (vals.length !== nr || vals.some(function (row) { return row.length !== nc; })) {
            throw new Error('setValues: 범위 크기와 값 크기가 달라요');
          }
          for (var i = 0; i < nr; i++) for (var j = 0; j < nc; j++) 칸쓰기(r + i, c + j, vals[i][j]);
          return g;
        },
        setValue: function (v) {
          for (var i = 0; i < nr; i++) for (var j = 0; j < nc; j++) 칸쓰기(r + i, c + j, v);
          return g;
        },
        setNumberFormat: function (f) {
          if (f === '@') for (var j = 0; j < nc; j++) t.글자칸[c + j] = true;
          return g;
        }
      };
      ['setFontWeight', 'setBackground', 'setFontColor', 'setHorizontalAlignment', 'setWrap',
        'setFontSize', 'setNote'].forEach(function (k) { g[k] = function () { return g; }; });
      return g;
    }

    var 탭 = {
      getName: function () { return t.이름; },
      setName: function (n) { t.이름 = n; return 탭; },
      getLastRow: 끝줄,
      getLastColumn: 끝칸,
      getDataRange: function () { return 범위(1, 1, Math.max(끝줄(), 1), Math.max(끝칸(), 1)); },
      getRange: function (r, c, nr, nc) { return 범위(r, c, nr, nc); },
      appendRow: function (arr) {
        var r = 끝줄() + 1;
        arr.forEach(function (v, j) { 칸쓰기(r, j + 1, v); });
        return 탭;
      },
      deleteRow: function (r) { t.줄.splice(r - 1, 1); return 탭; },
      _속: t
    };
    ['setFrozenRows', 'setColumnWidth', 'setTabColor', 'autoResizeColumns'].forEach(function (k) {
      탭[k] = function () { return 탭; };
    });
    return 탭;
  }

  탭들.push(가짜탭('시트1'));   // 새 구글 시트에는 빈 탭 하나가 있다

  var 시트파일 = {
    getSheets: function () { return 탭들.slice(); },
    getSheetByName: function (n) {
      for (var i = 0; i < 탭들.length; i++) if (탭들[i].getName() === n) return 탭들[i];
      return null;
    },
    insertSheet: function (n) {
      if (시트파일.getSheetByName(n)) throw new Error('같은 이름의 탭이 있어요: ' + n);
      var s = 가짜탭(n); 탭들.push(s); return s;
    },
    toast: function () {}
  };

  var 잠금중 = false;
  return {
    SpreadsheetApp: {
      getActiveSpreadsheet: function () { return 시트파일; },
      flush: function () {}
    },
    LockService: {
      getScriptLock: function () {
        return {
          tryLock: function () { if (잠금중) return false; 잠금중 = true; return true; },
          waitLock: function () { if (잠금중) throw new Error('잠금 실패'); 잠금중 = true; },
          releaseLock: function () { 잠금중 = false; }
        };
      }
    },
    HtmlService: {
      createHtmlOutputFromFile: function (f) {
        var o = { 파일: f, setTitle: function () { return o; }, addMetaTag: function () { return o; } };
        return o;
      }
    },
    Logger: { log: function () {} },
    시트파일: 시트파일,
    잠겨있나: function () { return 잠금중; }
  };
}


</script>
<script>
var 코드_원본 = "/**\r\n * 이달의 바른말 어린이 투표 — 서버 쪽 (Code.gs)\r\n *\r\n * 처음 한 번: 위쪽 함수 고르는 칸에서 「설치」를 고르고 [실행]을 누릅니다.\r\n * 학생 화면: 웹 앱 주소 그대로\r\n * 결과 화면: 웹 앱 주소 끝에 ?page=result\r\n *\r\n * 이 파일에는 학생 이름이 들어 있지 않습니다. 이름은 시트의 「명단」 탭에 적습니다.\r\n * 이름이 _ 로 끝나는 함수는 안에서만 쓰는 부품이라 바깥(학생 기기)에서 부를 수 없습니다.\r\n */\r\n\r\nvar TAB_ROSTER = '명단';\r\nvar TAB_SETTINGS = '설정';\r\nvar TAB_VOTES = '투표';\r\nvar TAB_LOG = '당선기록';\r\n\r\nvar PHASE_FIRST = '1차';\r\nvar PHASE_RUNOFF = '결선';\r\nvar PHASE_CLOSED = '마감';\r\n\r\nvar KEY = {\r\n  month: '이번 달',\r\n  phase: '단계',\r\n  runoff: '결선 후보',\r\n  tied: '동점자',\r\n  closedRound: '마감한 회차',\r\n  winner: '당선',\r\n  method: '정한 방법',\r\n  password: '결과 비밀번호'\r\n};\r\n\r\nvar CLASS_SIZE = 17;   // 설치할 때 명단 탭에 만들어 둘 번호 칸 수 (나중에 줄을 늘리거나 비워도 됩니다)\r\n\r\n\r\n/* ───────── 화면 열기 ───────── */\r\n\r\nfunction doGet(e) {\r\n  var isResult = !!(e && e.parameter && e.parameter.page === 'result');\r\n  return HtmlService.createHtmlOutputFromFile(isResult ? 'Result' : 'Index')\r\n    .setTitle(isResult ? '바른말 어린이 결과' : '바른말 어린이 뽑기')\r\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1');\r\n}\r\n\r\n\r\n/* ───────── 처음 한 번: 탭 만들기 ─────────\r\n * 이미 있는 탭과 적어 둔 내용은 건드리지 않습니다. 여러 번 눌러도 괜찮습니다. */\r\n\r\nfunction 설치() {\r\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\r\n  var made = [];\r\n\r\n  // 새 시트에 처음부터 있는 빈 탭(시트1)은 「명단」으로 이름만 바꿔 씁니다.\r\n  var sheets = ss.getSheets();\r\n  if (!ss.getSheetByName(TAB_ROSTER) && sheets.length === 1 && sheets[0].getLastRow() === 0) {\r\n    sheets[0].setName(TAB_ROSTER);\r\n  }\r\n\r\n  var roster = ss.getSheetByName(TAB_ROSTER) || ss.insertSheet(TAB_ROSTER);\r\n  if (roster.getLastRow() === 0) {\r\n    var rows = [['번호', '이름']];\r\n    for (var i = 1; i <= CLASS_SIZE; i++) rows.push([i, '']);\r\n    roster.getRange(1, 1, rows.length, 2).setValues(rows);\r\n    roster.getRange(1, 1, 1, 2).setFontWeight('bold').setBackground('#E4EBF8');\r\n    roster.getRange(1, 3).setValue('← 이름 칸에 학생 이름을 적어 주세요. 이름이 빈 줄은 투표에 나오지 않아요.');\r\n    roster.setFrozenRows(1);\r\n    roster.setColumnWidth(2, 140);\r\n    made.push(TAB_ROSTER);\r\n  }\r\n\r\n  var settings = ss.getSheetByName(TAB_SETTINGS) || ss.insertSheet(TAB_SETTINGS);\r\n  if (settings.getLastRow() === 0) {\r\n    settings.getRange(1, 2, 20, 1).setNumberFormat('@');   // 값 칸은 글자로 둡니다 (3, 7 이 37로 바뀌지 않게)\r\n    var month = (new Date().getMonth() + 1) + '월';\r\n    var pw = String(Math.floor(1000 + Math.random() * 9000));\r\n    var srows = [\r\n      ['항목', '값', '설명'],\r\n      [KEY.month, month, '결과 화면의 [새 달 시작]으로 바꿔요'],\r\n      [KEY.phase, PHASE_FIRST, '1차 / 결선 / 마감 — 결과 화면 버튼이 바꿔요'],\r\n      [KEY.runoff, '', '결선에 오른 번호 (손대지 마세요)'],\r\n      [KEY.tied, '', '마감했을 때 동점인 번호 (손대지 마세요)'],\r\n      [KEY.closedRound, '', '마지막으로 마감한 회차 (손대지 마세요)'],\r\n      [KEY.winner, '', '이번 달 당선 번호 (손대지 마세요)'],\r\n      [KEY.method, '', '1차 투표 / 결선 투표 / 추첨'],\r\n      [KEY.password, pw, '결과 화면에 들어갈 때 써요. 바꿔도 돼요']\r\n    ];\r\n    settings.getRange(1, 1, srows.length, 3).setValues(srows);\r\n    settings.getRange(1, 1, 1, 3).setFontWeight('bold').setBackground('#E4EBF8');\r\n    settings.setFrozenRows(1);\r\n    settings.setColumnWidth(1, 120);\r\n    settings.setColumnWidth(3, 320);\r\n    made.push(TAB_SETTINGS);\r\n  }\r\n\r\n  var votes = ss.getSheetByName(TAB_VOTES) || ss.insertSheet(TAB_VOTES);\r\n  if (votes.getLastRow() === 0) {\r\n    votes.getRange(1, 1, 1, 6).setValues([['시간', '달', '회차', '번호', '고른 사람1', '고른 사람2']])\r\n      .setFontWeight('bold').setBackground('#E4EBF8');\r\n    votes.setFrozenRows(1);\r\n    made.push(TAB_VOTES);\r\n  }\r\n\r\n  var log = ss.getSheetByName(TAB_LOG) || ss.insertSheet(TAB_LOG);\r\n  if (log.getLastRow() === 0) {\r\n    log.getRange(1, 1, 1, 5).setValues([['달', '번호', '이름', '정한 방법', '정한 때']])\r\n      .setFontWeight('bold').setBackground('#E4EBF8');\r\n    log.setFrozenRows(1);\r\n    made.push(TAB_LOG);\r\n  }\r\n\r\n  var msg = made.length\r\n    ? '설치 끝! 만든 탭: ' + made.join(', ') + '. 「명단」에 이름을 적고 「설정」에서 결과 비밀번호를 확인하세요.'\r\n    : '탭이 이미 다 있어요. 바꾼 것은 없습니다.';\r\n  try { ss.toast(msg, '바른말 투표', 10); } catch (err) { /* 화면이 없을 때는 넘어갑니다 */ }\r\n  Logger.log(msg);\r\n  return msg;\r\n}\r\n\r\n\r\n/* ───────── 판정 로직 시작 ─────────\r\n * 집계·동점·투표 검사. 미리보기_테스트.html도 이 파일을 통째로 넣어 쓰므로\r\n * 시험판과 진짜가 같은 계산을 합니다. */\r\n\r\nfunction toNo_(v) {\r\n  var n = parseInt(String(v === null || v === undefined ? '' : v).trim(), 10);\r\n  return (isFinite(n) && n > 0) ? n : 0;\r\n}\r\n\r\nfunction parseList_(s) {\r\n  var seen = {}, out = [];\r\n  String(s === null || s === undefined ? '' : s).split(/[^0-9]+/).forEach(function (x) {\r\n    var n = toNo_(x);\r\n    if (n && !seen[n]) { seen[n] = true; out.push(n); }\r\n  });\r\n  return out;\r\n}\r\n\r\n// 명단 탭의 줄들 → [{no, name}] (번호나 이름이 빈 줄은 건너뜀)\r\nfunction rosterFromRows_(rows) {\r\n  var list = [], seen = {};\r\n  for (var i = 1; i < rows.length; i++) {\r\n    var no = toNo_(rows[i][0]);\r\n    var name = String(rows[i][1] === null || rows[i][1] === undefined ? '' : rows[i][1]).trim();\r\n    if (!no || !name) continue;\r\n    if (seen[no]) throw new Error('명단에 ' + no + '번이 두 번 있어요. 「명단」 탭을 고쳐 주세요.');\r\n    seen[no] = true;\r\n    list.push({ no: no, name: name });\r\n  }\r\n  list.sort(function (a, b) { return a.no - b.no; });\r\n  return list;\r\n}\r\n\r\n// 투표 탭의 줄들 → [{month, round, no, picks}]\r\nfunction votesFromRows_(rows) {\r\n  var out = [];\r\n  for (var i = 1; i < rows.length; i++) {\r\n    var r = rows[i];\r\n    var no = toNo_(r[3]);\r\n    if (!no) continue;\r\n    out.push({\r\n      month: String(r[1]).trim(),\r\n      round: String(r[2]).trim(),\r\n      no: no,\r\n      picks: [toNo_(r[4]), toNo_(r[5])].filter(function (n) { return n > 0; })\r\n    });\r\n  }\r\n  return out;\r\n}\r\n\r\nfunction roundVotes_(votes, month, round) {\r\n  return votes.filter(function (v) { return v.month === month && v.round === round; });\r\n}\r\n\r\nfunction hasVoted_(votes, month, round, no) {\r\n  return roundVotes_(votes, month, round).some(function (v) { return v.no === no; });\r\n}\r\n\r\n// 후보마다 받은 표 → 많은 순(같으면 번호 순)\r\nfunction tally_(votes, month, round, candidateNos) {\r\n  var count = {};\r\n  candidateNos.forEach(function (n) { count[n] = 0; });\r\n  roundVotes_(votes, month, round).forEach(function (v) {\r\n    v.picks.forEach(function (p) { if (count.hasOwnProperty(p)) count[p] += 1; });\r\n  });\r\n  return candidateNos\r\n    .map(function (n) { return { no: n, count: count[n] }; })\r\n    .sort(function (a, b) { return (b.count - a.count) || (a.no - b.no); });\r\n}\r\n\r\n// 1등 표 수와 1등인 번호들 (둘 이상이면 동점)\r\nfunction topOf_(tally) {\r\n  if (!tally.length) return { count: 0, nos: [] };\r\n  var max = tally[0].count;\r\n  return {\r\n    count: max,\r\n    nos: tally.filter(function (t) { return t.count === max; }).map(function (t) { return t.no; })\r\n  };\r\n}\r\n\r\n// 지금 세고 있는(또는 방금 마감한) 회차\r\nfunction currentRound_(st) {\r\n  if (st.phase === PHASE_FIRST || st.phase === PHASE_RUNOFF) return st.phase;\r\n  if (st.phase === PHASE_CLOSED) return st.closedRound || '';\r\n  return '';\r\n}\r\n\r\n// 한 표를 받기 전에 하는 검사. 문제가 없으면 null.\r\nfunction checkVote_(st, voterNo, picks, clientPhase) {\r\n  if (st.phase === PHASE_CLOSED) return { code: 'closed', msg: '투표가 끝났어요.' };\r\n  if (st.phase !== PHASE_FIRST && st.phase !== PHASE_RUNOFF) {\r\n    return { code: 'setting', msg: '설정 탭의 「단계」가 이상해요. 선생님께 알려 주세요.' };\r\n  }\r\n  if (String(clientPhase) !== st.phase) {\r\n    return { code: 'stale', msg: '선생님이 투표를 바꾸셨어요. 처음부터 다시 해 주세요.' };\r\n  }\r\n  var no = toNo_(voterNo);\r\n  var rosterNos = st.roster.map(function (s) { return s.no; });\r\n  if (rosterNos.indexOf(no) < 0) return { code: 'who', msg: '명단에 없는 번호예요.' };\r\n  if (hasVoted_(st.votes, st.month, st.phase, no)) return { code: 'done', msg: '이 번호는 벌써 냈어요.' };\r\n\r\n  var need = st.phase === PHASE_FIRST ? 2 : 1;\r\n  var p = Array.isArray(picks) ? picks.map(toNo_) : [];\r\n  if (p.length !== need || p.some(function (x) { return !x; })) {\r\n    return { code: 'count', msg: need === 2 ? '친구를 꼭 2명 골라 주세요.' : '1명만 골라 주세요.' };\r\n  }\r\n  if (need === 2 && p[0] === p[1]) return { code: 'count', msg: '서로 다른 친구 2명을 골라 주세요.' };\r\n  if (p.indexOf(no) >= 0) return { code: 'self', msg: '자기 자신은 고를 수 없어요.' };\r\n  var allowed = st.phase === PHASE_FIRST ? rosterNos : st.runoff;\r\n  if (p.some(function (x) { return allowed.indexOf(x) < 0; })) {\r\n    return st.phase === PHASE_RUNOFF\r\n      ? { code: 'pick', msg: '결선에 오른 친구 중에서 골라 주세요.' }\r\n      : { code: 'pick', msg: '명단에 없는 친구예요.' };\r\n  }\r\n  return null;\r\n}\r\n\r\n// 마감할 때의 판정: 1명이면 당선, 여럿이면 동점\r\nfunction decideClose_(st) {\r\n  var round = st.phase;\r\n  if (round !== PHASE_FIRST && round !== PHASE_RUNOFF) return { ok: false, msg: '지금은 마감할 투표가 없어요.' };\r\n  if (roundVotes_(st.votes, st.month, round).length === 0) return { ok: false, msg: '아직 낸 사람이 없어요.' };\r\n  var cands = round === PHASE_FIRST ? st.roster.map(function (s) { return s.no; }) : st.runoff;\r\n  var top = topOf_(tally_(st.votes, st.month, round, cands));\r\n  if (top.nos.length === 1) {\r\n    return { ok: true, round: round, winner: top.nos[0], tied: [], method: round === PHASE_FIRST ? '1차 투표' : '결선 투표' };\r\n  }\r\n  return { ok: true, round: round, winner: 0, tied: top.nos, method: '' };\r\n}\r\n\r\nfunction nextMonthName_(m) {\r\n  var hit = /^(\\d+)\\s*월/.exec(String(m));\r\n  return hit ? ((parseInt(hit[1], 10) % 12) + 1) + '월' : '';\r\n}\r\n\r\n/* ───────── 판정 로직 끝 ───────── */\r\n\r\n\r\n/* ───────── 시트 읽고 쓰기 ───────── */\r\n\r\nfunction sheet_(name) {\r\n  var sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(name);\r\n  if (!sh) throw new Error('「' + name + '」 탭이 없어요. 앱스 스크립트에서 「설치」를 먼저 실행해 주세요.');\r\n  return sh;\r\n}\r\n\r\nfunction readSettings_() {\r\n  var rows = sheet_(TAB_SETTINGS).getDataRange().getValues();\r\n  var map = {};\r\n  rows.forEach(function (r) {\r\n    var k = String(r[0]).trim();\r\n    if (k) map[k] = String(r[1] === null || r[1] === undefined ? '' : r[1]).trim();\r\n  });\r\n  return map;\r\n}\r\n\r\nfunction writeSettings_(changes) {\r\n  var sh = sheet_(TAB_SETTINGS);\r\n  var rows = sh.getDataRange().getValues();\r\n  Object.keys(changes).forEach(function (k) {\r\n    var v = String(changes[k]);\r\n    for (var i = 0; i < rows.length; i++) {\r\n      if (String(rows[i][0]).trim() === k) { sh.getRange(i + 1, 2).setValue(v); return; }\r\n    }\r\n    sh.appendRow([k, v, '']);\r\n  });\r\n}\r\n\r\nfunction loadState_() {\r\n  var s = readSettings_();\r\n  return {\r\n    settings: s,\r\n    month: s[KEY.month] || '',\r\n    phase: s[KEY.phase] || '',\r\n    runoff: parseList_(s[KEY.runoff]),\r\n    tied: parseList_(s[KEY.tied]),\r\n    closedRound: s[KEY.closedRound] || '',\r\n    winner: toNo_(s[KEY.winner]),\r\n    method: s[KEY.method] || '',\r\n    roster: rosterFromRows_(sheet_(TAB_ROSTER).getDataRange().getValues()),\r\n    votes: votesFromRows_(sheet_(TAB_VOTES).getDataRange().getValues())\r\n  };\r\n}\r\n\r\nfunction nameOf_(st, no) {\r\n  for (var i = 0; i < st.roster.length; i++) if (st.roster[i].no === no) return st.roster[i].name;\r\n  return no + '번';\r\n}\r\n\r\nfunction logWinner_(st, no, method) {\r\n  var sh = sheet_(TAB_LOG);\r\n  var rows = sh.getDataRange().getValues();\r\n  var row = [st.month, no, nameOf_(st, no), method, new Date()];\r\n  for (var i = 1; i < rows.length; i++) {\r\n    if (String(rows[i][0]).trim() === st.month) { sh.getRange(i + 1, 1, 1, 5).setValues([row]); return; }\r\n  }\r\n  sh.appendRow(row);\r\n}\r\n\r\nfunction clearLog_(month) {\r\n  var sh = sheet_(TAB_LOG);\r\n  var rows = sh.getDataRange().getValues();\r\n  for (var i = rows.length - 1; i >= 1; i--) {\r\n    if (String(rows[i][0]).trim() === month) sh.deleteRow(i + 1);\r\n  }\r\n}\r\n\r\nfunction withLock_(fn) {\r\n  var lock = LockService.getScriptLock();\r\n  if (!lock.tryLock(20000)) {\r\n    return { ok: false, code: 'busy', msg: '친구들이 한꺼번에 내고 있어요. 잠깐 뒤에 다시 눌러 주세요.' };\r\n  }\r\n  try { return fn(); } finally { lock.releaseLock(); }\r\n}\r\n\r\n\r\n/* ───────── 학생 화면이 부르는 것 ───────── */\r\n\r\n// 누가 누구를 뽑았는지는 보내지 않습니다. 「냈는지」만 보냅니다.\r\nfunction getStudentState() {\r\n  var st = loadState_();\r\n  var round = currentRound_(st);\r\n  return {\r\n    month: st.month,\r\n    phase: st.phase,\r\n    candidates: st.phase === PHASE_RUNOFF ? st.runoff : [],\r\n    roster: st.roster.map(function (s) {\r\n      return { no: s.no, name: s.name, voted: round ? hasVoted_(st.votes, st.month, round, s.no) : false };\r\n    })\r\n  };\r\n}\r\n\r\nfunction submitVote(voterNo, picks, clientPhase) {\r\n  return withLock_(function () {\r\n    var st = loadState_();\r\n    var err = checkVote_(st, voterNo, picks, clientPhase);\r\n    if (err) return { ok: false, code: err.code, msg: err.msg };\r\n    var p = picks.map(toNo_);\r\n    sheet_(TAB_VOTES).appendRow([new Date(), st.month, st.phase, toNo_(voterNo), p[0], p.length > 1 ? p[1] : '']);\r\n    SpreadsheetApp.flush();\r\n    return { ok: true };\r\n  });\r\n}\r\n\r\n\r\n/* ───────── 결과 화면이 부르는 것 (모두 비밀번호 확인) ───────── */\r\n\r\nfunction pwOk_(st, pw) {\r\n  var real = String(st.settings[KEY.password] || '').trim();\r\n  return real !== '' && String(pw === null || pw === undefined ? '' : pw).trim() === real;\r\n}\r\n\r\nvar PW_FAIL = { ok: false, code: 'pw', msg: '비밀번호가 맞지 않아요.' };\r\n\r\nfunction resultView_(st) {\r\n  var round = currentRound_(st);\r\n  var rosterNos = st.roster.map(function (s) { return s.no; });\r\n  var voters = {};\r\n  if (round) roundVotes_(st.votes, st.month, round).forEach(function (v) { voters[v.no] = true; });\r\n  var named = function (t) { return { no: t.no, name: nameOf_(st, t.no), count: t.count }; };\r\n  var person = function (n) { return { no: n, name: nameOf_(st, n) }; };\r\n  var hasRunoff = st.runoff.length > 0;\r\n  var awaitingRunoff = st.phase === PHASE_CLOSED && st.closedRound === PHASE_FIRST && !st.winner && st.tied.length > 1;\r\n  var awaitingDraw = st.phase === PHASE_CLOSED && st.
