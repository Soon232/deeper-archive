<style>
:root {
  --bg: #F2F5F8;
  --ink: #232E3B;
  --navy: #1E3A5F;
  --blue: #3D5A80;
  --dawn: #A85426;
  --mist: #8DA3B9;
  --font-title: 'Gowun Batang', serif;
  --font-body: 'Nanum Myeongjo', serif;
  --font-caption: 'Gowun Dodum', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  word-break: keep-all;
  max-width: 720px;
  margin: 0 auto;
  padding: 2.5rem 1.25rem 4rem;
}
.back {
  font-family: var(--font-caption);
  font-size: 0.85rem;
  color: var(--blue);
  text-decoration: none;
}
.back:hover { color: var(--navy); }
h1 {
  font-family: var(--font-title);
  font-size: 2rem;
  font-weight: 700;
  color: var(--blue);
  margin: 2.2rem 0 0.5rem;
}
.lead {
  font-size: 0.95rem;
  line-height: 1.7;
  color: var(--ink);
  margin-bottom: 2.5rem;
}
.list { list-style: none; }
.list a {
  display: block;
  padding: 1.1rem 1.2rem;
  margin-bottom: 1rem;
  background: #FDFEFE;
  border: 1px solid #DDE5EC;
  border-left: 4px solid var(--blue);
  border-radius: 0 10px 10px 0;
  text-decoration: none;
  color: var(--ink);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.list a:hover {
  transform: translateX(6px);
  box-shadow: 0 4px 14px rgba(61, 90, 128, 0.12);
}
.date {
  font-family: var(--font-caption);
  font-size: 0.75rem;
  color: var(--blue);
  margin-bottom: 0.3rem;
}
.title {
  font-family: var(--font-title);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--blue);
  margin-bottom: 0.3rem;
}
.summary {
  font-size: 0.85rem;
  line-height: 1.7;
}
.placeholder {
  padding: 1.6rem 1.2rem;
  border: 1.5px dashed var(--mist);
  border-radius: 10px;
  text-align: center;
  font-family: var(--font-caption);
  font-size: 0.85rem;
  color: var(--blue);
  line-height: 1.8;
}
footer {
  margin-top: 4rem;
  text-align: center;
  font-family: var(--font-caption);
  font-size: 0.75rem;
  color: var(--blue);
}
</style>
</head>

  </ul>
  <footer>© 2026 곰곰 · 디퍼 언브랜딩 살롱의 기록</footer>

</html>
