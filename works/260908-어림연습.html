<title>수의 범위</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F3F5F7; --paper:#FFFFFF; --ink:#1B2430; --muted:#5F6B7A; --line:#D7DDE5;
  --accent:#2F55A4; --accent-ink:#FFFFFF; --accent-soft:#E4EBF8;
  --ok:#1F8A5B; --ok-soft:#DFF3E7; --no:#C8461C; --no-soft:#FBE6DE;
  --mark:#E36A2E; --mark-soft:#FFF0E3; --shadow:0 1px 2px rgba(20,30,50,.06), 0 6px 20px rgba(20,30,50,.06);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131820; --paper:#1C2330; --ink:#E9EDF3; --muted:#9AA6B6; --line:#2F3947;
    --accent:#8FB0F5; --accent-ink:#0F1726; --accent-soft:#26334D;
    --ok:#5FCF95; --ok-soft:#1D3A2C; --no:#F08A62; --no-soft:#46261B;
    --mark:#F59A63; --mark-soft:#4A2E1A; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#131820; --paper:#1C2330; --ink:#E9EDF3; --muted:#9AA6B6; --line:#2F3947;
  --accent:#8FB0F5; --accent-ink:#0F1726; --accent-soft:#26334D;
  --ok:#5FCF95; --ok-soft:#1D3A2C; --no:#F08A62; --no-soft:#46261B;
  --mark:#F59A63; --mark-soft:#4A2E1A; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:660px;margin:0 auto;padding:20px 16px 48px}
h1,h2,.display{font-family:"Jua","IBM Plex Sans KR",sans-serif;font-weight:400;letter-spacing:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.2;margin:0}
h2{font-size:1.35rem;margin:0}
.num{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 18px;font-weight:700;min-height:48px;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{font-size:1.15rem;padding:14px 24px;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.level-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.level{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:var(--r);padding:18px 18px;min-height:72px}
.level .display{font-size:1.4rem;line-height:1.1}
.level small{color:var(--muted);font-weight:500;line-height:1.45}
.level[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.level .best{font-size:.8rem;color:var(--accent);font-weight:700}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:26px;height:10px;border-radius:5px;background:var(--line);transition:background .2s}
.dot.now{background:var(--accent)}
.dot.ok{background:var(--ok)}
.dot.half{background:linear-gradient(90deg,var(--ok) 50%,var(--mark) 50%)}
.dot.no{background:var(--no)}
.q-text{font-size:1.28rem;line-height:1.55;margin:0;font-weight:500}
.q-text b,.feedback b.n{font-family:"IBM Plex Mono",monospace;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.figure{margin:4px 0 0;overflow-x:auto}
.figure svg,.feedback svg{display:block;width:100%;max-width:560px;height:auto}
.answer{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.answer input{font-family:"IBM Plex Mono",monospace;font-size:1.5rem;font-weight:700;width:9.5ch;max-width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.answer .unit{font-weight:700;font-size:1.1rem}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choices.three{grid-template-columns:repeat(3,1fr)}
.choice{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:14px;font-weight:700;font-size:1.08rem;text-align:center;min-height:56px;font-variant-numeric:tabular-nums}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.feedback{border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.feedback.no{background:var(--no-soft)}
.feedback.ok{background:var(--ok-soft)}
.feedback h2{font-size:1.25rem}
.feedback p{margin:0}
.digits{display:inline-flex;gap:4px;margin:2px 0}
.digit{width:40px;height:48px;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;font-family:"IBM Plex Mono",monospace;font-size:1.4rem;font-weight:700;background:var(--paper);position:relative}
.digit.target{border-color:var(--accent);background:var(--accent-soft)}
.digit.decide{border-color:var(--mark);box-shadow:inset 0 0 0 2px var(--mark)}
.digit.sep{width:14px;border:0;background:none;font-size:1.2rem}
.digit small{position:absolute;bottom:-20px;font-size:.68rem;color:var(--muted);font-family:"IBM Plex Sans KR",sans-serif;white-space:nowrap}
.digits-wrap{padding-bottom:20px;overflow-x:auto}
.legend{font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.steps{margin:0;padding-left:1.3em}
.steps li{margin:4px 0}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .display{font-size:2rem;line-height:1}
.stat small{color:var(--muted);font-weight:700}
.bar{display:grid;grid-template-columns:7em 1fr auto;gap:10px;align-items:center;font-size:.95rem}
.bar .track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--ok);border-radius:6px}
.miss{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:4px}
.miss:last-child{border-bottom:1px solid var(--line)}
.small{font-size:.9rem}
.grade{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:700;font-size:.9rem;flex:none}
.grade.half{background:var(--mark-soft);color:var(--mark)}
.grade.no{background:var(--no-soft);color:var(--no)}
.hidden{display:none!important}
@media (max-width:480px){
  body{font-size:16px} .wrap{padding:14px 12px 40px} .card{padding:18px 16px}
  .q-text{font-size:1.15rem} .choices{grid-template-columns:1fr} .choices.three{grid-template-columns:1fr}
  .digit{width:34px;height:42px;font-size:1.2rem}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap stack">

  <!-- 시작 화면 -->
  <section id="start" class="stack">
    <header class="top">
<meta name="robots" content="noindex, nofollow">
      <div>
        <div class="eyebrow">5학년 2학기 · 1단원 수의 범위와 어림하기</div>
        <h1>수의 범위</h1>
      </div>
      <button class="btn" id="theme-btn" type="button" aria-label="화면 밝기 바꾸기">☾</button>
    </header>
    <div class="card stack">
      <p style="margin:0">단계를 고르고 시작합니다. (한 단계당 10문제)<br>틀리면 설명을 읽고 <b>한 번 더</b> 풀 수 있어요.</p>
      <div class="level-grid" id="levels"></div>
      <div class="row">
        <input id="name" type="text" placeholder="이름 (안 써도 돼요)" maxlength="10" style="flex:1;min-width:140px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit">
        <button class="btn primary" id="go" type="button" style="flex:1">시작하기</button>
      </div>
    </div>
    <p class="muted small" style="margin:0">기록은 지금 쓰는 기기에만 남아요. 다른 기기에서 열면 새로 시작해요.</p>
  </section>

  <!-- 문제 화면 -->
  <section id="play" class="stack hidden">
    <header class="top">
      <div class="row" style="gap:8px">
        <span class="tag" id="play-level"></span>
        <span class="muted small" id="play-count"></span>
      </div>
      <button class="btn" id="quit" type="button">그만두기</button>
    </header>
    <div class="dots" id="dots" aria-label="진행"></div>
    <div class="card stack">
      <div class="row" style="justify-content:space-between">
        <span class="tag" id="q-concept"></span>
        <button class="btn" id="speak-q" type="button" style="padding:6px 12px;min-height:36px" aria-label="문제 읽어 주기">🔈 읽어 주기</button>
      </div>
      <p class="q-text" id="q-text"></p>
      <div class="figure" id="q-figure"></div>
      <div id="q-answer"></div>
      <div class="row">
        <button class="btn primary big" id="check" type="button">정답 확인</button>
      </div>
    </div>
    <div id="feedback" class="feedback hidden"></div>
  </section>

  <!-- 결과 화면 -->
  <section id="result" class="stack hidden">
    <header class="top">
      <div>
        <div class="eyebrow" id="r-eyebrow"></div>
        <h1 id="r-title"></h1>
      </div>
    </header>
    <div class="card stack">
      <div class="result-grid" id="r-stats"></div>
      <p class="small muted" style="margin:0">○ 한 번에 맞힘 · △ 설명 보고 맞힘 · × 두 번 다 틀림</p>
      <div class="stack" id="r-bars" style="gap:8px"></div>
    </div>
    <div class="card stack" id="r-miss-card">
      <h2>다시 볼 문제</h2>
      <div id="r-miss"></div>
    </div>
    <div class="row">
      <button class="btn primary big" id="again" type="button" style="flex:1">같은 단계 한 판 더</button>
      <button class="btn big" id="home" type="button" style="flex:1">단계 고르기</button>
    </div>
  </section>
</div>

<script>
/* ---------- 공통 도구 ---------- */
const $ = s => document.querySelector(s);
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[ri(0,arr.length-1)];
const chance = p => Math.random() < p;
const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; };
const DIGIT_NAME = ['일','십','백','천','만','십만','백만'];
const DEC_NAME = {0.1:'소수 첫째',0.01:'소수 둘째',0.001:'소수 셋째'};
function pname(p){ if(p>=1) return DIGIT_NAME[Math.round(Math.log10(p))]; return DEC_NAME[+p.toFixed(3)]||''; }
// 다섯 자리부터 쉼표 (교과서 표기)
const fmtN = n => Number.isInteger(n) ? (Math.abs(n)>=10000 ? n.toLocaleString('ko-KR') : String(n)) : String(+n.toFixed(3));
function roundTo(n, p, mode){
  const q = n / p; let r;
  if(mode==='up') r = Math.ceil(q - 1e-9); else if(mode==='down') r = Math.floor(q + 1e-9); else r = Math.floor(q + 0.5 + 1e-9);
  return +(r*p).toFixed(4);
}
const digitAt = (n,place) => Math.floor(n/place + 1e-9) % 10;
const setDigit = (n,place,d) => n - digitAt(n,place)*place + d*place;
const MODE_NAME = {up:'올림', down:'버림', round:'반올림'};
const C = {range:'수의 범위', up:'올림', down:'버림', round:'반올림', judge:'어림 고르기', mix:'섞어서'};
const RULE = {
  '수의 범위':'이상·이하는 그 수를 넣고, 초과·미만은 그 수를 빼요.',
  '반올림':'반올림은 나타낼 자리의 바로 아래 자리를 봐요. 5도 올려요.',
  '올림':'올림은 아래에 0이 아닌 수가 있으면 무조건 위로. 아래가 다 0이면 그대로.',
  '버림':'버림은 아래 자리를 모두 0으로. 아래 숫자가 커도 버려요.',
  '어림 고르기':'모자라면 안 되면 올림, 남는 것을 버리면 버림, "약"으로 말하면 반올림.',
  '섞어서':'조건이 둘이면 하나씩 좁혀요. 끝 수가 들어가는지 매번 확인해요.'
};
const WORD = {ge:'이상', le:'이하', gt:'초과', lt:'미만'};
// 숫자 뒤 조사 맞추기: 0·1·3·6·7·8은 받침 있음, 1·7·8은 ㄹ받침
function fixJosa(html){
  const bat = d => '013678'.includes(d), lieul = d => '178'.includes(d);
  return html
    .replace(/(\d)(<\/b>)?(을|를)(?![가-힣])/g,(m,d,b,j)=>d+(b||'')+(bat(d)?'을':'를'))
    .replace(/(\d)(<\/b>)?(이|가)(?=[ ,.)]|$)/g,(m,d,b,j)=>d+(b||'')+(bat(d)?'이':'가'))
    .replace(/(\d)(<\/b>)?(은|는)(?=[ ,.)]|$)/g,(m,d,b,j)=>d+(b||'')+(bat(d)?'은':'는'))
    .replace(/(\d)(<\/b>)?(이에요|예요)/g,(m,d,b,j)=>d+(b||'')+(bat(d)?'이에요':'예요'))
    .replace(/(\d)(<\/b>)?(이라|라)(?=[ ,.)]|$)/g,(m,d,b,j)=>d+(b||'')+(bat(d)?'이라':'라'))
    .replace(/(\d)(<\/b>)?(이면|면)(?=[ ,.)]|$)/g,(m,d,b,j)=>d+(b||'')+(bat(d)?'이면':'면'))
    .replace(/(\d)(<\/b>)?(으로|로)(?=[ ,.)]|$)/g,(m,d,b,j)=>d+(b||'')+(bat(d)&&!lieul(d)?'으로':'로'));
}
const inRange = (v,k,b) => k==='ge'?v>=b : k==='le'?v<=b : k==='gt'?v>b : v<b;
const startOf = (a,k) => k==='ge'?a:a+1;
const endOf = (b,k) => k==='le'?b:b-1;

// 자리 상자 그림: target 자리(파랑)와 decide 자리(주황 테두리)
function digitsHTML(n, targetP, decideP){
  const s = Number.isInteger(n) ? String(n) : n.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
  const [intPart, decPart] = s.split('.');
  const cells = []; const L = intPart.length;
  intPart.split('').forEach((ch,i)=>{ const p=Math.pow(10,L-1-i); cells.push(cell(ch,p,DIGIT_NAME[L-1-i]||'')); });
  if(decPart!==undefined){
    cells.push('<span class="digit sep">.</span>');
    decPart.split('').forEach((ch,i)=>{ const p=+Math.pow(10,-(i+1)).toFixed(3); cells.push(cell(ch,p,DEC_NAME[p]||'')); });
  }
  function cell(ch,p,name){
    const cls=['digit']; if(targetP!=null && Math.abs(p-targetP)<1e-9) cls.push('target'); if(decideP!=null && Math.abs(p-decideP)<1e-9) cls.push('decide');
    return `<span class="${cls.join(' ')}">${ch}<small>${name}</small></span>`;
  }
  const legend = `<div class="legend"><i style="background:var(--accent-soft);border:2px solid var(--accent)"></i>나타낼 자리 ${decideP!=null?'<i style="border:2px solid var(--mark);margin-left:8px"></i>봐야 할 자리':''}</div>`;
  return `<div class="digits-wrap"><span class="digits">${cells.join('')}</span></div>${legend}`;
}
// 수직선 그림. marks: [{v, filled, dir:'right'|'left'|null}] — 둘이면 그 사이를 칠한다
function numberLine(lo, hi, marks){
  const W=560, H=90, L=36, R=W-36, y=48; const n=hi-lo; const x = v => L + (v-lo)/n*(R-L);
  const every = [1,2,5,10,20,50,100,200,500,1000,2000,5000,10000].find(e=>n/e<=8) || 10000;
  const fs = hi>=10000?12:14; const ticks=[];
  for(let v=Math.ceil(lo/every)*every; v<=hi+1e-9; v+=every){
    ticks.push(`<line x1="${x(v)}" y1="${y-7}" x2="${x(v)}" y2="${y+7}" stroke="var(--muted)" stroke-width="2"/><text x="${x(v)}" y="${y+28}" text-anchor="middle" font-size="${fs}" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`);
  }
  let range='';
  if(marks.length===2) range=`<line x1="${x(marks[0].v)}" y1="${y}" x2="${x(marks[1].v)}" y2="${y}" stroke="var(--accent)" stroke-width="6"/>`;
  else if(marks.length===1 && marks[0].dir){ const m=marks[0]; range=`<line x1="${x(m.v)}" y1="${y}" x2="${m.dir==='right'?R+6:L-6}" y2="${y}" stroke="var(--accent)" stroke-width="6"/>`; }
  const dots = marks.map(m=>`<circle cx="${x(m.v)}" cy="${y}" r="8" fill="${m.filled?'var(--accent)':'var(--paper)'}" stroke="var(--accent)" stroke-width="3"/><text x="${x(m.v)}" y="${y-16}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--accent)" font-family="IBM Plex Mono,monospace">${m.v}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="수직선"><line x1="${L-14}" y1="${y}" x2="${R+14}" y2="${y}" stroke="var(--muted)" stroke-width="2"/><polygon points="${R+14},${y-5} ${R+24},${y} ${R+14},${y+5}" fill="var(--muted)"/>${ticks.join('')}${range}${dots}</svg>`;
}

/* ---------- 문제 틀 ----------
   각 틀: {concept, type:'number'|'choice', text(html), figure?, answer, unit?, choices?, places?(소수 자릿수),
           explain(wrong)->html  : 틀렸을 때 보여 줄 설명. 답은 말하지 않는다.
           solution:[...]        : 두 번 틀렸을 때 보여 줄 풀이(답 포함)}  */

// 어림용 수 만들기 — 경계 사례를 일부러 섞는다 (5 처리, 9 넘어감, 아래 자리 모두 0)
function genRound(mode, digits){
  const p = digits===4 ? pick([10,100,1000]) : pick([10,100,1000,10000]);
  const lo=Math.pow(10,digits-1), hi=Math.pow(10,digits)-1; let n=ri(lo,hi); const decide=p/10; const r=Math.random();
  if(mode==='round'){
    if(r<0.3) n=setDigit(n,decide,5);
    else if(r<0.45){ n=setDigit(n,p,9); n=setDigit(n,decide,ri(5,9)); }
  } else if(mode==='up'){
    if(r<0.12) n=n-(n%p);
    else if(r<0.32){ n=setDigit(n,p,9); if(n%p===0) n+=ri(1,p-1); }
  } else {
    if(r<0.5) n=setDigit(n,decide,ri(5,9));
  }
  if(n<lo) n+=p; if(n>hi) n-=p;
  return {n,p};
}
function roundExplain(n,p,mode){ // {hint, why}
  const decide=p/10, dd=digitAt(n,decide), under=n%p, td=digitAt(n,p);
  let hint, carry='';
  if(mode==='round'){
    hint=`${pname(p)}의 자리까지 반올림하려면 그 바로 아래 자리인 <b>${pname(decide)}의 자리</b>를 봐요. ${pname(p)}의 자리 숫자를 보는 게 아니에요. 그 숫자가 <b>${dd}</b>이니까 ${dd>=5?(dd===5?'올려요. 5도 올려요.':'올려요.'):'버려요.'}`;

function tplRangeWord(){

  const neg = chance(0.5); const ins = v=>inRange(v,k,b);
  let good, bads; const near=[b-2,b-1,b,b+1,b+2,b+3,b-3];
  if(neg){ good = incl ? (up?b-1:b+1) : b; bads = shuffle(near.filter(v=>v!==good && ins(v))).slice(0,3); }
  else { const goods=near.filter(ins); good = (incl&&chance(0.4)) ? b : pick(goods); bads = shuffle(near.filter(v=>!ins(v))).slice(0,3); }
  if(bads.length<3) return tplRangeWord();
  const choices=shuffle([good,...bads]).map(String);
  const meaning = k==='ge'?`${b}와 같거나 큰 수`:k==='le'?`${b}와 같거나 작은 수`:k==='gt'?`${b}보다 큰 수`:`${b}보다 작은 수`;
  return { concept:C.range, type:'choice', choices, answer:String(good),
    text:`다음 중 <b>${b} ${WORD[k]}</b>인 수${neg?'가 <u>아닌</u> 것은':'는'} 어느 것인가요?`,
    explain:w=>`<p><b>${b} ${WORD[k]}</b>${(k==='ge'||k==='lt')?'은':'는'} ${meaning}예요. ${incl?`${b}도 들어가요. '이상·이하'는 그 수를 <b>넣어요</b>.`:`${b}는 ${b}보다 ${up?'크지':'작지'} 않으니 안 들어가요. '초과·미만'은 그 수를 <b>빼요</b>.`}${w?` 내가 고른 ${w}은 ${+w===b?'기준 수 그 자체예요.':(+w>b?`${b}보다 커요.`:`${b}보다 작아요.`)}`:''}</p>${numberLine(b-5,b+5,[{v:b,filled:incl,dir:up?'right':'left'}])}`,
    solution:[`${b} ${WORD[k]} = ${meaning}. ${incl?b+'도 들어가요.':b+'는 안 들어가요.'}`, `보기 중 ${neg?'들어가지 않는':'들어가는'} 수는 ${good}뿐이에요.`] };

    {a:'반올림', t:()=>{const n=ri(12,89)*1000+ri(100,999); return `어느 도시의 인구 ${fmtN(n)}명을 신문에 "약 몇 만 명"이라고 쓰려고 합니다.`;}, why:'"약"으로 말할 때는 가까운 쪽으로 어림해요. 이때 쓰는'},

// H4 반올림하여 어떤 수가 되는 원래 수 (가장 작은/큰)
function tplBackExtreme(){

  return { concept:C.round, type:'number', answer:ans,

    explain:w=>`<p>반올림해서 ${fmtN(M)}이 되는 수는 ${fmtN(M)}보다 <b>${p/2} 작은 수</b>부터예요. 그 수는 ${pname(p/10)}의 자리가 5라서 올라와요. ${fmtN(M)}보다 ${p/2} 큰 수는 ${fmtN(M+p)}으로 올라가니 빠져요. ${which==='small'?'가장 작은 수는 이 범위의 첫 수예요.':'가장 큰 수는 빠지는 수의 <b>바로 앞</b> 수예요. 경계 수 자체는 아니에요.'}</p>`,
    solution:[`${M-p/2}부터 ${M+p/2-1}까지 (${M-p/2}는 올라가고, ${M+p/2}는 ${M+p}이 됨)`, `가장 ${which==='small'?'작은':'큰'} 수 ${ans}`] };
}

// S1 두 범위를 함께 만족하는 자연수 개수
function tplTwoRanges(){
  const a=ri(10,60); const c=a+ri(3,8); const b=c+ri(2,7); const d=b+ri(2,8);
  const k1=pick(['ge','gt']),k2=pick(['le','lt']),k3=pick(['ge','gt']),k4=pick(['le','lt']);
  const s1=startOf(a,k1),e1=endOf(b,k2),s2=startOf(c,k3),e2=endOf(d,k4); const s=Math.max(s1,s2), e=Math.min(e1,e2);
  if(e-s<1) return tplTwoRanges(); const list=[]; for(let v=s;v<=e;v++) list.push(v);
  return { concept:C.mix, type:'number', answer:list.length, unit:'개',
    text:`<b>${a} ${WORD[k1]} ${b} ${WORD[k2]}</b>이면서 <b>${c} ${WORD[k3]} ${d} ${WORD[k4]}</b>인 자연수는 모두 몇 개인가요?`,
    explain:w=>`<p>범위를 하나씩 풀어요. 첫 번째는 <b>${s1}부터 ${e1}까지</b>, 두 번째는 <b>${s2}부터 ${e2}까지</b>예요. 둘 다에 들어가는 수는 더 큰 시작 수부터 더 작은 끝 수까지예요. 그 수들을 써서 세어요.</p>${numberLine(a-2,d+2,[{v:a,filled:k1==='ge'},{v:b,filled:k2==='le'}])}${numberLine(a-2,d+2,[{v:c,filled:k3==='ge'},{v:d,filled:k4==='le'}])}`,
    solution:[`첫째 ${s1}~${e1}, 둘째 ${s2}~${e2}`, `겹치는 수: ${list.join(', ')}`, `${list.length}개`] };
}
// S2 범위 안의 배수 개수
function tplMultiples(){
  const k=pick([3,4,5,6,7]); let a=ri(10,80); let b=a+ri(10,30); if(chance(0.5)) a=Math.ceil(a/k)*k; if(chance(0.5)) b=Math.floor(b/k)*k; if(b-a<10) return tplMultiples();
  const k1=pick(['ge','gt']),k2=pick(['le','lt']); const s=startOf(a,k1),e=endOf(b,k2); const list=[]; for(let v=s;v<=e;v++) if(v%k===0) list.push(v);

    text:`<b>${a} ${WORD[k1]} ${b} ${WORD[k2]}</b>인 자연수 중에서 <b>${k}</b>의 배수는 모두 몇 개인가요?`,
    explain:w=>`<p>먼저 범위를 정해요. <b>${s}부터 ${e}까지</b>예요. 그 안에서 ${k}의 배수(${k}, ${k*2}, ${k*3}, …)를 하나씩 써 봐요.${(a%k===0||b%k===0)?` 끝 수 ${a%k===0?a:b}이 ${k}의 배수예요. ${a%k===0?(k1==='ge'?`${a} 이상이니 들어가요.`:`${a} 초과이니 빠져요.`):(k2==='le'?`${b} 이하이니 들어가요.`:`${b} 미만이니 빠져요.`)}`:''}</p>`,
    solution:[`범위 ${s}~${e}`, `${k}의 배수: ${list.join(', ')}`, `${list.length}개`] };
}
// S3 어림값에서 원래 수의 범위 (보기 고르기)
function tplRangeChoice(){
  const mode=pick(['round','up','down']); const p=pick([10,100]); const M=ri(12,98)*p;
  let lo,hi,w1,w2,wrongNum;
  if(mode==='round'){lo=M-p/2;hi=M+p/2;w1='이상';w2='미만';wrongNum=`${fmtN(M)} 이상 ${fmtN(M+p)} 미만`;}
  else if(mode==='up'){lo=M-p;hi=M;w1='초과';w2='이하';wrongNum=`${fmtN(M-p)} 이상 ${fmtN(M)} 미만`;}
  else {lo=M;hi=M+p;w1='이상';w2='미만';wrongNum=`${fmtN(M-p/2)} 이상 ${fmtN(M+p/2)} 미만`;}
  const sw={'이상':'초과','초과':'이상','이하':'미만','미만':'이하'};
  const ansS=`${fmtN(lo)} ${w1} ${fmtN(hi)} ${w2}`;
  const choices=shuffle([ansS, `${fmtN(lo)} ${sw[w1]} ${fmtN(hi)} ${w2}`, `${fmtN(lo)} ${w1} ${fmtN(hi)} ${sw[w2]}`, wrongNum]);
  const hint = mode==='round'?`반올림해서 ${fmtN(M)}이 되는 수는 ${fmtN(M)}보다 <b>${p/2} 작은 수</b>부터 시작해요(그 수는 ${pname(p/10)}의 자리가 5라 올라와요). ${fmtN(M)}보다 ${p/2} 큰 수가 되면 ${fmtN(M+p)}으로 올라가니 그 수는 빼요. 첫 수는 넣고, 끝 수는 빼요.`
    : mode==='up'?`올림해서 ${fmtN(M)}이 되려면 ${fmtN(M)} 자신은 그대로라 <b>들어가고</b>, ${fmtN(M-p)}은 올릴 게 없어 그대로 ${fmtN(M-p)}이라 <b>빠져요</b>. 시작 수는 빼고 끝 수는 넣는 모양이에요.`
    : `버림해서 ${fmtN(M)}이 되려면 ${fmtN(M)} 자신부터 <b>들어가요</b>. ${fmtN(M+p)}은 버려도 ${fmtN(M+p)}이라 <b>빠져요</b>. 시작 수는 넣고 끝 수는 빼는 모양이에요.`;
  return { concept:C[mode], type:'choice', choices, answer:ansS,
    text:`${MODE_NAME[mode]}하여 ${pname(p)}의 자리까지 나타내면 <b>${fmtN(M)}</b>이 되는 자연수의 범위를 바르게 나타낸 것은?`,
    explain:w=>`<p>${hint}</p>`,
    solution:[hint.replace(/<\/?b>/g,''), ansS] };
}
// S4 소수 어림
function tplDecimal(){
  const mode=pick(['round','up','down']); const p=pick([0.1,0.01]); const decide=+(p/10).toFixed(3); const places=p===0.1?1:2;
  let n=ri(1001,9999)/1000; let zeroCase=false;
  if(p===0.1 && chance(0.1)){ // 결과가 .0으로 끝나는 경우를 일부러 (2.97 → 3.0)
    const w=ri(1,8); n = mode==='down' ? w+ri(1,9)/100+ri(1,9)/1000 : w+0.9+ri(5,9)/100+ri(1,9)/1000; zeroCase=true;
  }
  n=+n.toFixed(3);
  const ans=roundTo(n,p,mode);
  if(!zeroCase && ans.toFixed(places).endsWith('0')) return tplDecimal(); /* 0으로 끝나는 답은 위 경우에만 */
  const dd=Math.floor(n/decide+1e-6)%10;
  const ex = mode==='round'?`${pname(p)} 자리까지 반올림하니까 바로 아래인 <b>${pname(decide)} 자리</b>를 봐요. ${n}의 그 자리는 <b>${dd}</b>예요. ${dd>=5?'올려요.':'버려요.'}`: mode==='up'?`${pname(p)} 자리 아래에 0이 아닌 숫자가 있으니 <b>무조건</b> 올려요. 소수도 자연수와 똑같아요.`:`${pname(p)} 자리 아래를 <b>모두 지워요</b>. 아래 숫자가 커도 버려요.`;
  const zero = ans.toFixed(places).endsWith('0') ? ` 답이 0으로 끝나면 0까지 써요. ${pname(p)} 자리까지 나타냈다는 게 보이게요.` : '';
  return { concept:C[mode], type:'number', answer:ans, places, decimal:true,
    text:`<b>${n}</b>을 ${MODE_NAME[mode]}하여 ${pname(p)} 자리까지 나타내면 얼마인가요?`,
    explain:w=>`${digitsHTML(n,p,mode==='round'?decide:null)}<p>${ex}${zero}</p>`,
    solution:[`${pname(p)} 자리 찾기`, ex.replace(/<\/?b>/g,''), `답 ${ans.toFixed(places)}`] };
}

  return { concept:C.mix, type:'number', answer:ans,
    text:`<b>${n}</b>을 올림하여 ${pname(p)}의 자리까지 나타낸 수와 반올림하여 ${pname(p)}의 자리까지 나타낸 수의 차는 얼마인가요?`,
    explain:w=>`${digitsHTML(n,p,decide)}<p>두 수를 <b>각각</b> 구해요. 올림은 아래에 수가 있으니 무조건 위로. 반올림은 ${pname(decide)}의 자리 <b>${dd}</b>를 보고 ${dd>=5?'올려요':'버려요'}. 둘이 <b>같을 수도</b> 있어요. 그러면 차는 0이에요.</p>`,
    solution:[`올림 ${u}, 반올림 ${r}`, `${u} − ${r} = ${ans}`] };
}

// S7 두 가지 어림 결과로 원래 수 되짚기
function tplTwoMethods(){
  const p=pick([10,100]); let n=ri(1000,9999); if(n%p===0) n+=1;
  const down=roundTo(n,p,'down'), up=down+p;
  if(chance(0.5)){
    return { concept:C.mix, type:'number', answer:p-1, unit:'개',
      text:`어떤 자연수를 올림하여 ${pname(p)}의 자리까지 나타내면 <b>${fmtN(up)}</b>이고, 버림하여 ${pname(p)}의 자리까지 나타내면 <b>${fmtN(down)}</b>입니다. 이 자연수가 될 수 있는 수는 모두 몇 개인가요?`,
      explain:w=>`<p>둘로 나눠 생각해요. 버림해서 ${fmtN(down)}이 되는 수는 <b>${fmtN(down)}부터</b> ${fmtN(up)} 바로 앞까지. 올림해서 ${fmtN(up)}이 되는 수는 ${fmtN(down)} 바로 뒤부터 <b>${fmtN(up)}까지</b>. 둘 다 맞으려면 ${fmtN(down)} 자신(올려도 ${fmtN(down)})과 ${fmtN(up)} 자신(버려도 ${fmtN(up)})은 빠져요. 그 사이 수를 세어요.</p>`,
      solution:[`버림 조건: ${down} ~ ${up-1}`, `올림 조건: ${down+1} ~ ${up}`, `둘 다: ${down+1}부터 ${up-1}까지 → ${p-1}개`] };
  }
  const r=roundTo(n,p,'round'); const lo = r===down ? down : down+p/2; const hi = r===down ? down+p/2-1 : up-1;
  return { concept:C.mix, type:'number', answer:hi-lo+1, unit:'개',
    text:`어떤 자연수를 반올림하여 ${pname(p)}의 자리까지 나타내면 <b>${fmtN(r)}</b>이고, 버림하여 ${pname(p)}의 자리까지 나타내면 <b>${fmtN(down)}</b>입니다. 이 자연수가 될 수 있는 수는 모두 몇 개인가요?`,
    explain:w=>`<p>버림해서 ${fmtN(down)}이 되는 수는 <b>${fmtN(down)}부터 ${fmtN(up-1)}까지</b>예요. 이 중에서 반올림하면 ${fmtN(r)}이 되는 것만 남겨요. ${pname(p/10)}의 자리가 ${r===down?'0~4인 수는 내려가고 5~9인 수는 올라가요. 내려가는 쪽':'5~9인 수는 올라가고 0~4인 수는 내려가요. 올라가는 쪽'}이 답이에요.</p>`,
    solution:[`버림 조건: ${down} ~ ${up-1}`, `그중 반올림해서 ${r}이 되는 수: ${lo} ~ ${hi}`, `${hi-lo+1}개`] };
}
// S8 숫자 카드로 만든 수 중 조건에 맞는 가장 큰/작은 수
function tplCards(){
  const cards=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,4); const p=100;
  const perms=[]; const go=(rest,cur)=>{ if(!rest.length){perms.push(+cur.join(''));return;} rest.forEach((d,i)=>go(rest.filter((_,j)=>j!==i),cur.concat(d))); }; go(cards,[]);
  const groups={}; perms.forEach(x=>{ const m=roundTo(x,p,'round'); (groups[m]=groups[m]||[]).push(x); });
  const keys=Object.keys(groups).filter(k=>groups[k].length>=2); if(!keys.length) return tplCards();
  const M=+pick(keys); const list=groups[M].sort((a,b)=>a-b); const which=pick(['small','large']); const ans=which==='small'?list[0]:list[list.length-1];
  return { concept:C.mix, type:'number', answer:ans,
    text:`숫자 카드 <b>${cards.join(', ')}</b>를 한 번씩 모두 사용하여 네 자리 수를 만들려고 합니다. 만든 수를 반올림하여 백의 자리까지 나타내면 <b>${fmtN(M)}</b>이 되는 수 중에서 가장 ${which==='small'?'작은':'큰'} 수는 얼마인가요?`,
    explain:w=>`<p>반올림해서 ${fmtN(M)}이 되려면 <b>${M-50} 이상 ${M+50} 미만</b>이어야 해요. 천의 자리와 백의 자리를 먼저 정하고, 십의 자리 카드가 5 이상인지 미만인지로 올라가는지 내려가는지가 정해져요. 조건에 맞는 수를 여러 개 만들어 보고 그중 가장 ${which==='small'?'작은':'큰'} 것을 골라요.${w&&roundTo(w,p,'round')!==M?` 내가 쓴 ${w}은 반올림하면 ${roundTo(w,p,'round')}이 돼요.`:''}</p>`,
    solution:[`조건에 맞는 수: ${list.join(', ')}`, `가장 ${which==='small'?'작은':'큰'} 수 ${ans}`] };
}
// S9 올림한 대수 × 비용
function tplBusCost(){
  const K=pick([30,40,45]); const q=ri(3,9); const r=ri(1,K-1); const N=K*q+r; const Cst=ri(5,20)*10000; const ans=(q+1)*Cst;
  return { concept:C.mix, type:'number', answer:ans, unit:'원',
    text:`학생 <b>${N}</b>명이 <b>${K}</b>인승 버스를 타고 현장 학습을 갑니다. 버스 한 대를 빌리는 데 <b>${fmtN(Cst)}</b>원이 든다면, 버스를 빌리는 데 모두 얼마가 필요한가요?`,
    explain:w=>`<p>두 단계예요. 먼저 버스가 몇 대인지 정해요. ${N} ÷ ${K}의 몫은 <b>${q}</b>, 나머지 <b>${r}</b>명도 타야 하니 한 대 더(올림). 그다음 대수에 ${fmtN(Cst)}원을 곱해요.${w&&Math.abs(w-q*Cst)<1?' 남은 학생을 빼고 계산한 것 같아요.':''}</p>`,
    solution:[`${N} ÷ ${K} = ${q} … ${r} → ${q+1}대 (올림)`, `${q+1} × ${fmtN(Cst)} = ${fmtN(ans)}원`] };
}

const LEVELS = {
  easy:  {label:'easy',  ko:'쉬움',  desc:'자리 하나 어림하기, 이상·이하 낱말 뜻',
          mix:[[()=>tplRoundSimple('round','easy'),2],[()=>tplRoundSimple('up','easy'),2],[()=>tplRoundSimple('down','easy'),1],[tplRangeWord,2],[tplSituationWord,1],[tplLineRead,2]]},
  medium:{label:'medium',ko:'보통',  desc:'문장 속 어림, 수직선 읽기, 조건에 맞는 수 세기, 소수 어림',
          mix:[[()=>tplStoryRound('medium'),1],[tplLineTwo,2],[tplCountNaturals,2],[tplTwoWordPick,1],[tplGuessMethod,1],[tplGuided,1],[tplTrap,1],[tplDecimal,1]]},
  hard:  {label:'hard',  ko:'어려움',desc:'상황에 맞는 어림 고르기, 어림한 수에서 거꾸로 찾기',
          mix:[[tplBus,2],[tplBox,2],[tplMoney,1],[tplWhichMode,2],[tplBackExtreme,2],[tplBackExtremeUD,1]]},
  super: {label:'super hard',ko:'도전',desc:'조건 둘 겹치기, 두 어림 결과로 되짚기, 숫자 카드',
          mix:[[tplTwoRanges,1],[tplMultiples,1],[tplRangeChoice,2],[tplMixed,2],[tplTwoMethods,1],[tplCards,2],[tplBusCost,1]]},
};
function makeSet(lvlKey){
  const mix=LEVELS[lvlKey].mix; let idx=[]; mix.forEach(([_,w],i)=>{ for(let k=0;k<w;k++) idx.push(i); });
  let order; for(let t=0;t<60;t++){ order=shuffle(idx); if(order.every((v,i)=>i===0||v!==order[i-1])) break; }
  const used={}; return order.map(i=>{ let q,tries=0; do{ q=mix[i][0](); tries++; }while(used[q.text]&&tries<6); used[q.text]=1; return q; });
}

/* ---------- 상태와 화면 ---------- */
const state={level:null, set:[], i:0, attempts:[], tries:0, selected:null};
const STORE='어림열문제_기록';
function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE)||'{}'); }catch(e){ return {}; } }
function saveStore(o){ try{ localStorage.setItem(STORE,JSON.stringify(o)); }catch(e){} }

function renderLevels(){
  const store=loadStore();
  $('#levels').innerHTML=Object.entries(LEVELS).map(([k,l])=>{
    const best=store[k]&&store[k].best!=null?`<span class="best">최고 ${store[k].best}/10 · ${store[k].plays}판</span>`:'';
    return `<button type="button" class="level" data-level="${k}" aria-pressed="${state.level===k}"><span class="display">${l.label} <span style="font-size:1rem;color:var(--muted)">(${l.ko})</span></span>${best}</button>`;
  }).join('');
  $('#levels').querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>{ state.level=b.dataset.level; renderLevels(); }));
}
function show(id){ ['start','play','result'].forEach(s=>$('#'+s).classList.toggle('hidden', s!==id)); window.scrollTo({top:0}); }
function startGame(){
  if(!state.level){ $('#levels').style.outline='3px solid var(--accent)'; $('#levels').style.borderRadius='14px'; setTimeout(()=>$('#levels').style.outline='',900); return; }
  state.set=makeSet(state.level); state.i=0; state.attempts=[];
  $('#play-level').textContent=LEVELS[state.level].label; show('play'); renderQ();
}
function renderDots(){
  $('#dots').innerHTML=state.set.map((_,i)=>{ const a=state.attempts[i]; const cls=a==null?(i===state.i?'now':''):a===1?'ok':a===2?'half':'no'; return `<span class="dot ${cls}"></span>`; }).join('');
}
function renderQ(){
  const q=state.set[state.i]; state.tries=0; state.selected=null; renderDots();
  $('#play-count').textContent=`${state.i+1} / 10`; $('#q-concept').textContent=q.concept; $('#q-text').innerHTML=fixJosa(q.text); $('#q-figure').innerHTML=q.figure||'';
  $('#feedback').classList.add('hidden'); $('#feedback').innerHTML='';
  $('#check').textContent='정답 확인'; $('#check').disabled=false; $('#check').onclick=check;
  const A=$('#q-answer');
  if(q.type==='number'){
    A.innerHTML=`<div class="answer"><input id="ans" type="text" inputmode="${q.decimal?'decimal':'numeric'}" autocomplete="off" aria-label="답">${q.unit?`<span class="unit">${q.unit}</span>`:''}</div>`;
    const inp=$('#ans'); inp.focus(); inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#check').click(); } });
  } else {
    A.innerHTML=`<div class="choices ${q.three?'three':''}">${q.choices.map(c=>`<button type="button" class="choice" data-v="${c}" aria-pressed="false">${c}</button>`).join('')}</div>`;
    A.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{ state.selected=b.dataset.v; A.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed', x===b)); }));
  }
}
// 입력 다듬기: 전각 숫자→반각, 쉼표·띄어쓰기·단위·'약' 떼기. 숫자가 아니면 null
function parseNum(raw){
  let s=String(raw||'').replace(/[０-９．，]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0));
  s=s.replace(/[,\s]/g,'').replace(/약/g,'').replace(/(명|개|대|장|상자|봉지|묶음|도막|원|권|cm|kg|m|점|살|이에요|입니다)$/,'');
  if(s===''||!/^-?\d+(\.\d+)?$/.test(s)) return null;
  return +s;
}
function isCorrect(q,u){ return q.type==='number' ? Math.abs(u-q.answer)<1e-6 : u===q.answer; }
function answerText(q){ return q.type==='number' ? (q.decimal?q.answer.toFixed(q.places):fmtN(q.answer))+(q.unit||'') : q.answer; }
function check(){
  const q=state.set[state.i]; const F=$('#feedback');
  let u, raw='';
  if(q.type==='number'){ raw=$('#ans').value; u=parseNum(raw); if(u===null){ flash(raw.trim()===''?'답을 먼저 써 주세요.':'숫자만 써 주세요. 쉼표나 단위는 안 써도 돼요.'); return; } }
  else { u=state.selected; if(u==null){ flash('보기 중 하나를 골라 주세요.'); return; } }
  state.tries++; F.classList.remove('hidden');
  if(isCorrect(q,u)){
    state.attempts[state.i]=state.tries===1?1:2; F.className='feedback ok';
    let note='';
    if(q.decimal && !String(raw).includes('.')) note=`<p class="small">${q.answer.toFixed(q.places)}이라고 쓰면 ${q.places===1?'소수 첫째':'소수 둘째'} 자리까지 나타냈다는 게 보여요.</p>`;
    F.innerHTML=`<h2>${state.tries===1?'맞았어요!':'이번엔 맞았어요.'}</h2><p><b class="n">${answerText(q)}</b></p>${note}${state.tries>1?`<p class="small">${RULE[q.concept]||''}</p>`:''}`;
    lockAndNext();
  } else if(state.tries===1){
    F.className='feedback no';
    const wrongText=q.type==='number'?(q.decimal?String(u):fmtN(u)):u;
    F.innerHTML=fixJosa(`<h2>아직이에요. 설명을 읽고 한 번 더 풀어 봐요.</h2><p class="muted small">내가 쓴 답: ${wrongText}</p>${q.explain(u)}<div class="row"><button class="btn" type="button" id="speak-x">🔈 설명 읽어 주기</button></div>`);
    $('#speak-x').onclick=()=>speak(F.innerText.replace(/🔈.*/,'').replace(/나타낼 자리.*봐야 할 자리/,''));
    $('#check').textContent='다시 확인';
    if(q.type==='number'){ $('#ans').value=''; $('#ans').focus(); }
    else { state.selected=null; $('#q-answer').querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed','false')); }
    F.scrollIntoView({behavior:'smooth',block:'nearest'});
  } else {
    state.attempts[state.i]=3; F.className='feedback no';
    F.innerHTML=fixJosa(`<h2>정답은 <b class="n">${answerText(q)}</b></h2><ol class="steps">${q.solution.map(s=>`<li>${s}</li>`).join('')}</ol><p class="small muted">이 문제는 끝에 「다시 볼 문제」에 모아 둘게요.</p>`);
    lockAndNext();
  }
  renderDots();
}
function lockAndNext(){
  $('#q-answer').querySelectorAll('input,button').forEach(x=>x.disabled=true);
  const last=state.i===state.set.length-1;
  $('#check').textContent=last?'결과 보기':'다음 문제'; $('#check').onclick=()=>{ if(last) finish(); else { state.i++; renderQ(); } }; $('#check').focus();
}
function flash(msg){ const F=$('#feedback'); F.className='feedback no'; F.classList.remove('hidden'); F.innerHTML=`<p>${msg}</p>`; }

function finish(){
  const a=state.attempts; const ok=a.filter(x=>x===1).length, half=a.filter(x=>x===2).length, no=a.filter(x=>x===3).length; const score=ok+half;
  const store=loadStore(); const s=store[state.level]||{best:null,plays:0}; s.plays++; s.best=s.best==null?score:Math.max(s.best,score); store[state.level]=s; saveStore(store);
  const name=$('#name').value.trim();
  $('#r-eyebrow').textContent=`${LEVELS[state.level].label} · ${new Date().toLocaleDateString('ko-KR')}${name?' · '+name:''}`;
  $('#r-title').textContent= no===0&&half===0?'열 문제 모두 한 번에!': score>=8?`열 문제 중 ${score}개 맞혔어요`: score>=5?`${score}개 맞혔어요. 설명이 힘이 됐지요?`:`${score}개. 다시 볼 문제부터 한 번 더 읽어요.`;
  $('#r-stats').innerHTML=`<div class="stat"><div class="display" style="color:var(--ok)">${ok}</div><small>○ 한 번에</small></div><div class="stat"><div class="display" style="color:var(--mark)">${half}</div><small>△ 설명 보고</small></div><div class="stat"><div class="display" style="color:var(--no)">${no}</div><small>× 못 맞힘</small></div>`;
  const byC={}; state.set.forEach((q,i)=>{ byC[q.concept]=byC[q.concept]||{n:0,ok:0}; byC[q.concept].n++; if(a[i]<3) byC[q.concept].ok++; });
  $('#r-bars').innerHTML=Object.entries(byC).map(([c,v])=>`<div class="bar"><span>${c}</span><div class="track"><div class="fill" style="width:${v.ok/v.n*100}%"></div></div><span class="num small">${v.ok}/${v.n}</span></div>`).join('');
  const miss=state.set.map((q,i)=>({q,i,g:a[i]})).filter(x=>x.g>1);
  $('#r-miss-card').classList.toggle('hidden', miss.length===0);
  $('#r-miss').innerHTML=fixJosa(miss.map(x=>`<div class="miss"><div class="row" style="gap:8px"><span class="grade ${x.g===2?'half':'no'}">${x.g===2?'△':'×'}</span><span class="small muted">${x.i+1}번 · ${x.q.concept}</span></div><div>${x.q.text}</div><div class="small">정답 <b class="num">${answerText(x.q)}</b> — ${x.q.solution[x.q.solution.length-1]}</div></div>`).join(''));
  show('result');
}
function speak(text){
  if(!('speechSynthesis' in window)) return; window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/[○●]/g,'').replace(/\s+/g,' ')); u.lang='ko-KR'; u.rate=0.95; window.speechSynthesis.speak(u);
}

/* ---------- 이벤트 ---------- */
$('#go').addEventListener('click',startGame);
$('#quit').addEventListener('click',()=>{ if(confirm('이 판을 그만둘까요? 지금까지 푼 것은 저장되지 않아요.')){ renderLevels(); show('start'); } });
$('#again').addEventListener('click',startGame);
$('#home').addEventListener('click',()=>{ renderLevels(); show('start'); });
$('#speak-q').addEventListener('click',()=>speak($('#q-text').innerText));
$('#theme-btn').addEventListener('click',()=>{
  const r=document.documentElement; const cur=r.getAttribute('data-theme'); const dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  r.setAttribute('data-theme',dark?'light':'dark'); $('#theme-btn').textContent=dark?'☾':'☀'; try{ localStorage.setItem('어림열문제_테마',dark?'light':'dark'); }catch(e){}
});
try{ const t=localStorage.getItem('어림열문제_테마'); if(t){ document.documentElement.setAttribute('data-theme',t); $('#theme-btn').textContent=t==='dark'?'☀':'☾'; } }catch(e){}
renderLevels();
